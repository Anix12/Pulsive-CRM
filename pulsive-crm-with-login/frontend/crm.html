<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT pvt ltd — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ================= TOKENS ================= */
:root{
  --bg:#F3F3FA;
  --surface:#FFFFFF;
  --surface-sunken:#F2EFFC;
  --border:#E7E5F3;
  --border-strong:#D9D5EF;
  --text:#211F2E;
  --text-dim:#6B6878;
  --text-faint:#9A97A9;
  --primary:#6D28D9;
  --primary-dark:#54209E;
  --primary-soft:#EEE6FC;
  --on-primary:#FFFFFF;
  --live:#B4740A;
  --live-soft:#FBF0DC;
  --connected:#1C9A5B;
  --connected-soft:#E1F5EA;
  --danger:#DA3E3E;
  --danger-soft:#FCE7E7;
  --shadow:0 1px 2px rgba(30,20,60,.05), 0 10px 28px -14px rgba(30,20,60,.16);
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --font-display:'Poppins',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171420;
    --surface:#211D2E;
    --surface-sunken:#282239;
    --border:#372F4A;
    --border-strong:#453B5C;
    --text:#F1EEFA;
    --text-dim:#AEA8C2;
    --text-faint:#7A7490;
    --primary:#9B6BF2;
    --primary-dark:#7C4DE0;
    --primary-soft:#332752;
    --on-primary:#1B1027;
    --live:#F2A93C;
    --live-soft:#3A2C0E;
    --connected:#3ED88A;
    --connected-soft:#123625;
    --danger:#FF6B6B;
    --danger-soft:#3C1919;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 32px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#171420; --surface:#211D2E; --surface-sunken:#282239; --border:#372F4A; --border-strong:#453B5C;
  --text:#F1EEFA; --text-dim:#AEA8C2; --text-faint:#7A7490;
  --primary:#9B6BF2; --primary-dark:#7C4DE0; --primary-soft:#332752; --on-primary:#1B1027;
  --live:#F2A93C; --live-soft:#3A2C0E; --connected:#3ED88A; --connected-soft:#123625;
  --danger:#FF6B6B; --danger-soft:#3C1919;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 32px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display);margin:0;}
::selection{background:var(--primary-soft);}
a{color:inherit;}

/* ================= LAYOUT ================= */
#app{display:flex;min-height:100vh;width:100%;}
.backdrop{position:fixed;inset:0;background:rgba(20,15,35,.4);z-index:60;display:none;}
.backdrop.show{display:block;}

.sidebar{
  width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:70;
  transition:transform .22s ease, width .22s ease;
}
.brand-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:30px;border:1px solid var(--border);margin-bottom:18px;width:fit-content;}
.brand-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#F2A93C,#E0679E,#6D28D9);flex:0 0 26px;}
.brand-title{font-family:var(--font-display);font-weight:600;font-size:13.5px;}
.nav{display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-s);
  color:var(--text-dim);cursor:pointer;font-weight:600;font-size:13.5px;border:none;background:transparent;
  width:100%;text-align:left;transition:background .12s ease,color .12s ease;
}
.nav-item svg{width:18px;height:18px;stroke:currentColor;flex:0 0 18px;}
.nav-item:hover{background:var(--surface-sunken);color:var(--text);}
.nav-item.active{background:var(--primary);color:var(--on-primary);}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:20px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.sidebar-footer{margin-top:auto;padding-top:14px;}
.nav-item.footer-item{color:var(--text-faint);}

/* ---------------- AUTH SCREEN ---------------- */
.auth-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px;box-shadow:var(--shadow);}
.rep-chip-sb{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;margin-bottom:4px;}
.rep-avatar-sb{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7C8FF2,#5B8DEF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;flex:0 0 28px;font-family:var(--font-display);}
.rep-meta-sb{flex:1;overflow:hidden;}
.rep-name-sb{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-email-sb{font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.logout-btn-sb{border:none;background:transparent;color:var(--text-faint);cursor:pointer;padding:4px;border-radius:6px;flex:0 0 auto;}
.logout-btn-sb:hover{color:var(--danger);background:var(--surface-sunken);}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:60px;flex:0 0 60px;border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:40;
}
.hamburger-btn{display:none;border:none;background:transparent;cursor:pointer;padding:6px;border-radius:8px;}
.hamburger-btn svg{width:20px;height:20px;stroke:var(--text);}
.hamburger-btn:hover{background:var(--surface-sunken);}
.topbar-title{font-family:var(--font-display);font-weight:600;font-size:17px;}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:6px;}
.top-icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
.top-icon-btn svg{width:19px;height:19px;stroke:var(--text-dim);}
.top-icon-btn:hover{background:var(--surface-sunken);}
.top-icon-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:30px;padding:8px 14px;width:250px;}
.search-box svg{width:15px;height:15px;stroke:var(--text-faint);flex:0 0 15px;}
.search-box input{border:none;background:transparent;outline:none;color:var(--text);font-size:13px;width:100%;}
.search-box input::placeholder{color:var(--text-faint);}
.filter-icn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;flex:0 0 36px;}
.filter-icn svg{width:15px;height:15px;stroke:var(--text-dim);}

.content{flex:1;min-width:0;padding:24px;overflow-y:auto;position:relative;}
.content-inner{max-width:1160px;}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.page-title{font-size:22px;}
.back-btn{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 34px;}
.back-btn svg{width:16px;height:16px;stroke:var(--primary);}
.chip-filter{display:flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);border:1px solid transparent;padding:6px 8px 6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;}
.chip-filter button{border:none;background:transparent;cursor:pointer;display:flex;color:var(--primary);}
.chip-filter svg{width:13px;height:13px;stroke:currentColor;}

/* ================= GENERIC ================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:30px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;padding:9px 18px;cursor:pointer;transition:transform .08s ease,background .12s ease;white-space:nowrap;}
.btn svg{width:14px;height:14px;stroke:currentColor;flex:0 0 14px;}
.btn:hover{background:var(--surface-sunken);}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
.btn-outline{background:transparent;border-color:var(--primary);color:var(--primary);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-ghost:hover{background:var(--surface);}
.btn-outline:hover{background:var(--primary-soft);}
.btn-connect{background:var(--connected);border-color:var(--connected);color:#04321c;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-sm{padding:6px 13px;font-size:12px;}
.btn-block{width:100%;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill-live{background:var(--live-soft);color:var(--live);}
.pill-connected{background:var(--connected-soft);color:var(--connected);}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill-neutral{background:var(--surface-sunken);color:var(--text-dim);}
.mono{font-family:var(--font-mono);}
.score-badge{font-family:var(--font-mono);font-weight:700;font-size:11.5px;padding:2px 8px;border-radius:20px;}
.score-hot{background:var(--connected-soft);color:var(--connected);}
.score-warm{background:var(--live-soft);color:var(--live);}
.score-cool{background:var(--surface-sunken);color:var(--text-dim);}
hr.rule{border:none;border-top:1px solid var(--border);margin:14px 0;}
.avatar{width:36px;height:36px;border-radius:50%;flex:0 0 36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:13px;color:#fff;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state svg{width:36px;height:36px;stroke:var(--border-strong);margin-bottom:12px;}
.empty-state .em-title{color:var(--text);font-weight:600;font-size:14px;margin-bottom:4px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.fab{position:fixed;bottom:26px;right:26px;width:54px;height:54px;border-radius:50%;background:var(--primary);border:none;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:90;}
.fab svg{width:22px;height:22px;stroke:#fff;}
.fab:hover{background:var(--primary-dark);}
.fab-menu{position:fixed;bottom:90px;right:26px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);box-shadow:var(--shadow);padding:8px;z-index:90;display:none;flex-direction:column;gap:2px;min-width:190px;}
.fab-menu.show{display:flex;}
.fab-menu button{display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:10px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;text-align:left;}
.fab-menu button svg{width:16px;height:16px;stroke:var(--primary);flex:0 0 16px;}
.fab-menu button:hover{background:var(--surface-sunken);}

/* ================= MODALS ================= */
.modal-overlay{position:fixed;inset:0;background:rgba(20,15,35,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius-l);padding:26px;width:100%;max-width:460px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h3{font-size:19px;}
.modal-head .x{border:none;background:var(--surface-sunken);width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-head .x svg{width:14px;height:14px;stroke:var(--text-dim);}
.field{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text);font-size:13.5px;outline:none;margin-bottom:12px;}
.field:focus{border-color:var(--primary);}
.field-label-sm{font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:block;}

/* ================= HOME ================= */
.welcome-card{padding:36px;position:relative;overflow:hidden;display:flex;align-items:center;gap:24px;min-height:200px;}
.welcome-text{position:relative;z-index:2;}
.welcome-text .hi{font-size:30px;font-weight:600;font-family:var(--font-display);}
.welcome-text .sub{font-size:19px;color:var(--text-dim);margin:2px 0 22px 0;}
.welcome-blob{flex:1;display:flex;justify-content:flex-end;opacity:.9;}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;}
.stat-card{padding:16px 18px;}
.stat-num{font-family:var(--font-mono);font-size:23px;font-weight:700;}
.stat-label{color:var(--text-faint);font-size:11.5px;margin-top:3px;}

/* ================= TABLES ================= */
.table-wrap{overflow-x:auto;}
table.data-table{width:100%;border-collapse:collapse;min-width:640px;}
table.data-table th{text-align:left;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.data-table td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13px;}
table.data-table tr:last-child td{border-bottom:none;}
.row-card-mobile{display:none;}

/* ================= MY LEADS ================= */
.bucket-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.bucket-card{padding:22px;display:flex;flex-direction:column;}
.bucket-card h3{color:var(--primary);font-size:17px;margin-bottom:8px;}
.bucket-card .bdesc{color:var(--text-dim);font-size:12.5px;flex:1;margin-bottom:18px;min-height:34px;}
.bucket-count{font-family:var(--font-mono);font-size:26px;font-weight:700;margin-bottom:2px;}
.bucket-actions{display:flex;gap:8px;margin-top:6px;}
.bucket-actions .btn{flex:1;}

.lead-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);}
.lead-row:last-child{border-bottom:none;}
.lead-meta{flex:1;min-width:0;}
.lead-name{font-weight:600;font-size:13.5px;}
.lead-sub{color:var(--text-faint);font-size:11.5px;margin-top:1px;}
.lead-phone{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;flex:0 0 34px;}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;}
.icon-btn:hover{background:var(--surface-sunken);}
.icon-btn.call{background:var(--connected);border-color:var(--connected);color:#04321c;}
.icon-btn.call:hover{filter:brightness(1.05);}
.stage-pill{padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}

/* ================= POWER SESSION BAR ================= */
.session-bar{padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.session-bar .info{flex:1;min-width:180px;}
.session-bar .info b{font-size:14px;}
.progress-track{height:6px;background:var(--surface-sunken);border-radius:10px;overflow:hidden;margin-top:8px;width:100%;}
.progress-fill{height:100%;background:var(--primary);border-radius:10px;transition:width .3s ease;}

/* ================= CALL LOGS ================= */
.tab-row{display:flex;gap:6px;background:var(--surface-sunken);border-radius:30px;padding:4px;width:fit-content;}
.tab-row button{border:none;background:transparent;padding:8px 18px;border-radius:26px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-dim);}
.tab-row button.active{background:var(--primary);color:#fff;}
.log-row{border-bottom:1px solid var(--border);}
.log-row:last-child{border-bottom:none;}
.log-main{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;flex-wrap:wrap;}
.log-main:hover{background:var(--surface-sunken);}
.log-col{font-size:12px;color:var(--text-dim);}
.log-detail{padding:0 14px 18px 60px;display:none;}
.log-detail.open{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.detail-block{background:var(--surface-sunken);border-radius:var(--radius-s);padding:12px 13px;}
.transcript-mini{font-size:12px;color:var(--text-dim);max-height:140px;overflow-y:auto;}
.transcript-mini p{margin:0 0 6px 0;}
.transcript-mini b{color:var(--text);}
.ai-summary-list{margin:0;padding-left:16px;font-size:12.5px;}
.ai-summary-list li{margin-bottom:4px;}
.caret{width:14px;height:14px;stroke:var(--text-faint);transition:transform .15s ease;flex:0 0 14px;}
.caret.open{transform:rotate(90deg);}
.next-action{display:flex;gap:8px;align-items:flex-start;}
.next-action svg{width:15px;height:15px;stroke:var(--primary);flex:0 0 15px;margin-top:1px;}
.next-action p{margin:0;font-size:12.5px;}

/* ================= REPORTS ================= */
.report-section{margin-bottom:16px;}
.report-section-title{font-size:15px;font-weight:600;margin-bottom:10px;font-family:var(--font-display);}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
.kpi-cell{padding:18px 20px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
.kpi-cell:nth-child(3n){border-right:none;}
.kpi-num{font-family:var(--font-mono);font-size:24px;font-weight:700;}
.kpi-label{color:var(--text-faint);font-size:11.5px;margin-top:4px;}
.reports-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chart-card{padding:18px 20px;}
.chart-wrap{height:210px;position:relative;margin-top:10px;}

/* ================= TASKS ================= */
.task-row{display:flex;align-items:flex-start;gap:12px;padding:14px;border-bottom:1px solid var(--border);}
.task-row:last-child{border-bottom:none;}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex:0 0 22px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.task-check.done{background:var(--connected);border-color:var(--connected);}
.task-check svg{width:12px;height:12px;stroke:#fff;}
.task-meta{flex:1;min-width:0;}
.task-note{font-weight:600;font-size:13.5px;}
.task-note.done{text-decoration:line-through;color:var(--text-faint);}
.task-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.task-when{text-align:right;}
.task-when .d{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.task-when .ch{font-size:10.5px;color:var(--text-faint);}

/* ================= WHATSAPP ================= */
.wa-layout{display:flex;height:calc(100vh - 160px);min-height:420px;border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
.wa-list{width:280px;flex:0 0 280px;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);}
.wa-thread-row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.wa-thread-row:hover,.wa-thread-row.active{background:var(--surface-sunken);}
.wa-thread-name{font-weight:600;font-size:13px;}
.wa-thread-msg{font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.wa-chat{flex:1;display:flex;flex-direction:column;background:var(--surface-sunken);}
.wa-chat-head{padding:13px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.wa-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
.wa-bubble{max-width:70%;padding:9px 13px;border-radius:14px;font-size:12.5px;}
.wa-bubble.in{background:var(--surface);align-self:flex-start;border-bottom-left-radius:3px;}
.wa-bubble.out{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.wa-input-row{padding:12px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;}
.wa-input-row input{flex:1;border:1px solid var(--border-strong);border-radius:24px;padding:10px 14px;outline:none;background:var(--surface-sunken);color:var(--text);}

/* ================= CALL DRAWER ================= */
.call-drawer{position:fixed;top:0;right:0;bottom:0;width:390px;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .22s ease;z-index:250;overflow-y:auto;}
.call-drawer.open{transform:translateX(0);}
.call-drawer-inner{padding:20px;}
.call-head{text-align:center;padding-bottom:14px;}
.call-avatar{width:58px;height:58px;border-radius:50%;margin:0 auto 10px auto;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:19px;color:#fff;background:linear-gradient(135deg,#F2A93C,#E0679E,#6D28D9);position:relative;}
.call-avatar .ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--live);animation:pulse 1.4s ease-out infinite;}
@keyframes pulse{0%{opacity:.7;transform:scale(.9);}100%{opacity:0;transform:scale(1.25);}}
.call-name{font-family:var(--font-display);font-weight:700;font-size:16.5px;}
.call-company{color:var(--text-faint);font-size:12.5px;margin-top:1px;}
.call-status-row{display:flex;justify-content:center;gap:8px;margin-top:10px;align-items:center;}
.call-timer{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
.masked-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:12px;padding:9px 10px;background:var(--surface-sunken);border-radius:var(--radius-s);gap:8px;}
.masked-row .mono{color:var(--text-dim);}
.call-controls{display:flex;justify-content:center;gap:10px;margin:16px 0;}
.ctrl-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-sunken);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;}
.ctrl-btn svg{width:18px;height:18px;stroke:currentColor;}
.ctrl-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
.ctrl-btn.rec.active{color:var(--danger);}
.ctrl-btn.rec .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--danger);}
.ctrl-btn.end{background:var(--danger);border-color:var(--danger);color:#fff;}
.field-label{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.field-block{margin-top:16px;}
textarea.notes{width:100%;min-height:64px;resize:vertical;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface-sunken);color:var(--text);padding:9px 10px;font-size:13px;outline:none;}
textarea.notes:focus{border-color:var(--primary);}
select.disp-select{width:100%;padding:10px 10px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface-sunken);color:var(--text);font-size:13px;outline:none;}
.live-transcript{background:var(--surface-sunken);border-radius:var(--radius-s);padding:10px 12px;max-height:120px;overflow-y:auto;font-size:12px;color:var(--text-dim);}
.live-transcript p{margin:0 0 7px 0;}
.live-transcript b{color:var(--text);}
.typing-dot{display:inline-flex;gap:2px;}
.typing-dot span{width:4px;height:4px;border-radius:50%;background:var(--text-faint);display:inline-block;animation:blink 1.2s infinite;}
.typing-dot span:nth-child(2){animation-delay:.2s;}
.typing-dot span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
.ai-block{margin-top:16px;border-radius:var(--radius-m);border:1px solid var(--border);background:var(--surface-sunken);padding:13px 14px;}
.ai-block-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.ai-block-head svg{width:14px;height:14px;stroke:var(--primary);}
.ai-block-head span{font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;}
.score-gauge-row{display:flex;align-items:center;gap:12px;}
.score-gauge{width:56px;height:56px;border-radius:50%;flex:0 0 56px;display:flex;align-items:center;justify-content:center;position:relative;}
.score-gauge svg{position:absolute;inset:0;transform:rotate(-90deg);}
.score-gauge .num{font-family:var(--font-mono);font-weight:700;font-size:15px;}
.followup-row{display:flex;gap:8px;margin-top:10px;}
.followup-row input,.followup-row select{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-s);padding:7px 8px;font-size:12px;color:var(--text);outline:none;}

/* dial pad modal */
.dialpad-card{padding:20px;width:100%;max-width:300px;}
.dial-display{font-family:var(--font-mono);font-size:22px;font-weight:600;text-align:center;min-height:30px;letter-spacing:.02em;margin-bottom:14px;word-break:break-all;}
.dial-display.placeholder{color:var(--text-faint);font-size:14px;font-weight:500;}
.dialpad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
.dial-key{aspect-ratio:1/1;border-radius:50%;border:1px solid var(--border);background:var(--surface-sunken);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:18px;font-weight:600;color:var(--text);}
.dial-key span.letters{font-family:var(--font-body);font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--text-faint);margin-top:1px;}
.dial-key:hover{background:var(--border);}
.dial-key:active{transform:scale(.95);}
.dialpad-row{display:flex;gap:8px;}
.dialpad-row .btn{flex:1;}
.masking-note{display:flex;gap:7px;align-items:flex-start;margin-top:12px;background:var(--surface-sunken);border-radius:var(--radius-s);padding:9px 10px;font-size:11.5px;color:var(--text-dim);}
.masking-note svg{width:13px;height:13px;stroke:var(--text-faint);flex:0 0 13px;margin-top:1px;}

/* ================= WEB DIALER (mobile companion) ================= */
.arch-strip{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:14px 16px;margin-bottom:16px;}
.arch-strip .chip{background:var(--surface-sunken);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;white-space:nowrap;}
.arch-strip .arrow{color:var(--text-faint);}
.wd-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}
.wd-lead-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;}
.wd-lead-row .meta{flex:1;min-width:0;}
.wd-lead-row .name{font-weight:600;font-size:13px;}
.wd-lead-row .sub{font-size:11px;color:var(--text-faint);}
.wd-stepper{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;}
.wd-step{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;color:var(--text-faint);padding:4px 8px;border-radius:12px;background:var(--surface-sunken);}
.wd-step.done{color:var(--connected);background:var(--connected-soft);}
.wd-step.current{color:var(--primary);background:var(--primary-soft);}
.wd-step.failed{color:var(--danger);background:var(--danger-soft);}
.wd-active{padding:18px;background:var(--surface-sunken);border-radius:var(--radius-m);margin-top:10px;}
.wd-status-big{font-family:var(--font-display);font-weight:600;font-size:15px;margin:8px 0 2px 0;}
.wd-status-sub{font-size:12px;color:var(--text-dim);}
.wd-spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--primary);display:inline-block;animation:wdspin .8s linear infinite;vertical-align:-2px;}
@keyframes wdspin{to{transform:rotate(360deg);}}
.wd-phone-wrap{display:flex;flex-direction:column;align-items:center;}
.wd-phone-label{font-size:11px;color:var(--text-faint);margin-bottom:8px;text-align:center;}
.wd-phone{width:260px;height:520px;background:#0d0d14;border-radius:34px;padding:9px;box-shadow:var(--shadow);}
.wd-phone-screen{width:100%;height:100%;background:var(--surface);border-radius:25px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.wd-phone-statusbar{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);}
.wd-phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:80px;height:16px;background:#0d0d14;border-bottom-left-radius:11px;border-bottom-right-radius:11px;z-index:5;}
.wd-phone-body{flex:1;display:flex;flex-direction:column;position:relative;}
.wd-phone-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,var(--primary-soft),var(--surface));}
.wd-phone-home .appicon{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#F2A93C,#E0679E,#6D28D9);}
.wd-phone-home .apptext{font-size:10.5px;color:var(--text-faint);}
.wd-phone-banner{position:absolute;top:12px;left:7px;right:7px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:9px 11px;box-shadow:var(--shadow);cursor:pointer;z-index:10;animation:wdslide .3s ease;}
@keyframes wdslide{from{transform:translateY(-40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.wd-phone-banner .brow{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;color:var(--text-faint);}
.wd-phone-banner .btitle{font-size:12px;font-weight:700;margin-top:3px;}
.wd-phone-banner .bsub{font-size:10.5px;color:var(--text-dim);}
.wd-phone-app-screen{flex:1;display:flex;flex-direction:column;padding:20px 14px;align-items:center;text-align:center;}
.wd-phone-app-screen .avatar{width:58px;height:58px;font-size:20px;margin-bottom:10px;}
.wd-phone-app-screen .pname{font-family:var(--font-display);font-weight:700;font-size:15px;}
.wd-phone-app-screen .pcompany{font-size:11px;color:var(--text-faint);margin-bottom:3px;}
.wd-phone-app-screen .pnumber{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-bottom:14px;}
.wd-phone-app-screen .tag{font-size:10px;color:var(--text-faint);background:var(--surface-sunken);padding:4px 9px;border-radius:20px;margin-bottom:14px;}
.wd-phone-btn-row{display:flex;gap:9px;width:100%;margin-top:auto;}
.wd-phone-btn-row .btn{flex:1;padding:11px;}
.wd-call-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 14px 22px 14px;background:#14121c;color:#fff;text-align:center;}
.wd-call-screen .avatar{width:70px;height:70px;font-size:23px;margin-bottom:12px;}
.wd-call-screen .pname{font-family:var(--font-display);font-weight:600;font-size:16px;color:#fff;}
.wd-call-screen .pnumber{font-family:var(--font-mono);font-size:11px;color:#a99fc2;margin-top:2px;}
.wd-call-screen .cstatus{font-size:11.5px;color:#c9bde8;margin-top:9px;}
.wd-call-screen .ctimer{font-family:var(--font-mono);font-size:14px;color:#fff;margin-top:5px;}
.wd-mid-icons{display:flex;gap:22px;margin:16px 0;}
.wd-mid-icons .mi{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#fff;}
.wd-mid-icons .mi svg{width:16px;height:16px;stroke:#fff;}
.wd-end-btn{width:52px;height:52px;border-radius:50%;background:var(--danger);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wd-end-btn svg{width:21px;height:21px;stroke:#fff;}
.wd-sync-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:18px;text-align:center;}
.wd-bigspin{width:28px;height:28px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--primary);animation:wdspin .9s linear infinite;}
.wd-tl-item{display:flex;gap:9px;padding:6px 0;font-size:11.5px;}
.wd-tl-time{font-family:var(--font-mono);color:var(--text-faint);width:60px;flex:0 0 60px;}
.wd-tl-dotcol{display:flex;flex-direction:column;align-items:center;width:13px;flex:0 0 13px;}
.wd-tl-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);margin-top:4px;}
.wd-tl-line{flex:1;width:1px;background:var(--border-strong);margin-top:2px;}

/* ================= RESPONSIVE ================= */
@media (max-width:1020px){
  .bucket-grid{grid-template-columns:repeat(2,1fr);}
  .reports-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .kpi-cell:nth-child(3n){border-right:1px solid var(--border);}
  .kpi-cell:nth-child(2n){border-right:none;}
}
@media (max-width:860px){
  .hamburger-btn{display:flex;align-items:center;justify-content:center;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .search-box{display:none;}
  .welcome-card{flex-direction:column;text-align:center;padding:26px 20px;}
  .welcome-blob{justify-content:center;}
  .welcome-blob svg{width:220px;}
  .stat-strip{grid-template-columns:repeat(2,1fr);}
  table.data-table{display:none;}
  .row-card-mobile{display:block;}
  .call-drawer{width:100%;}
  .detail-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .wd-grid{grid-template-columns:1fr;}
  .wd-phone-wrap{order:-1;}
}
@media (max-width:520px){
  .content{padding:16px;}
  .bucket-grid{grid-template-columns:1fr;}
  .stat-strip{grid-template-columns:1fr 1fr;}
  .fab{bottom:20px;right:18px;}
  .fab-menu{right:18px;bottom:84px;}
}

   Nothing in the dashboard renders until state.auth.user is set.

const AUTH_API_BASE = ""; // same-origin; the backend also serves this file

async function authApi(path, options={}){
  const res = await fetch(AUTH_API_BASE + path, {
    method: options.method || "GET",
    headers: { "Content-Type": "application/json", ...(state.auth.token ? {Authorization:"Bearer "+state.auth.token} : {}) },
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function setAuthView(v){ state.auth.view=v; state.auth.error=""; render(); }

async function submitLogin(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if(!email || !password){ state.auth.error="Email and password are required"; render(); return; }
  state.auth.loading=true; state.auth.error=""; render();
  try{
    const { token, user } = await authApi("/api/auth/login", { method:"POST", body:{ email, password } });
    onAuthSuccess(token, user);
  }catch(e){
    state.auth.loading=false; state.auth.error=e.message; render();
  }
}
async function submitSignup(){
  const name = document.getElementById("auth-name").value.trim();
  const company = document.getElementById("auth-company").value.trim();
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if(!name || !company || !email || !password){ state.auth.error="All fields are required"; render(); return; }
  state.auth.loading=true; state.auth.error=""; render();
  try{
    const { token, user } = await authApi("/api/auth/signup", { method:"POST", body:{ name, company, email, password } });
    onAuthSuccess(token, user);
  }catch(e){
    state.auth.loading=false; state.auth.error=e.message; render();
  }
}
let _demoSeeded = false;
function seedIfNeeded(){
  if(_demoSeeded) return;
  seedLogs();
  _demoSeeded = true;

function onAuthSuccess(token, user){
  state.auth.token = token;
  state.auth.user = user;
  state.auth.loading = false;
  localStorage.setItem("pulsive_token", token);
  REP_ME = user.name;
  TENANT = user.company;
  seedIfNeeded();
  render();
}
function logout(){
  localStorage.removeItem("pulsive_token");
  state.auth = { token:null, user:null, view:"login", loading:false, error:"" };
  render();
}
async function restoreSession(){
  const token = localStorage.getItem("pulsive_token");
  if(!token){ render(); return; }
  state.auth.token = token;
  try{
    const { user } = await authApi("/api/auth/me");
    state.auth.user = user;
    REP_ME = user.name;
    TENANT = user.company;
    seedIfNeeded();
  }catch(e){
    localStorage.removeItem("pulsive_token");
    state.auth = { token:null, user:null, view:"login", loading:false, error:"" };
  }
  render();
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------------- Router ---------------- */
function renderView(){
  if(state.view==="home") return renderHome();
  if(state.view==="campaigns") return renderCampaigns();
  if(state.view==="leads") return renderLeads();
  if(state.view==="whatsapp") return renderWhatsApp();
  if(state.view==="walkin") return renderWalkin();
  if(state.view==="logs") return renderLogs();
  if(state.view==="reports") return renderReports();
  if(state.view==="devices") return renderVoiceDevices();
  if(state.view==="webdialer") return renderWebDialer();
  if(state.view==="tasks") return renderTasks();
  return "";
}

/* ---------------- CAMPAIGNS ---------------- */
function campaignStats(cid){
  const cl = leads.filter(l=>l.campaign===cid);
  return {
    assigned: cl.length,
    unassigned: Math.max(0, Math.round(cl.length*0.15)),
    uncontacted: cl.filter(l=>l.stage==="uncontacted").length,
    inProgress: cl.filter(l=>l.stage==="in-progress"||l.stage==="follow-up"||l.stage==="not-connected").length,
    closed: cl.filter(l=>l.stage==="closed").length,
  };
}
function renderCampaigns(){
  return `
  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>No.</th><th>Campaign Name</th><th>Assigned Leads</th><th>Unassigned Leads</th><th>Uncontacted Leads</th><th>In-Progress</th><th>Closed Leads</th><th>Action</th></tr></thead>
        <tbody>
          ${CAMPAIGNS.map((c,i)=>{ const s=campaignStats(c.id); return `
          <tr>
            <td>${i+1}</td>
            <td style="font-weight:600;">${c.name}</td>
            <td>${s.assigned}</td>
            <td>${s.unassigned}</td>
            <td>${s.uncontacted}</td>
            <td>${s.inProgress}</td>
            <td>${s.closed}</td>
            <td><button class="btn btn-outline btn-sm" onclick="viewCampaignLeads('${c.id}')">View</button></td>
          </tr>`; }).join("")}
        </tbody>
      </table>
    </div>
    <div class="row-card-mobile">

        <div class="lead-row" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div style="display:flex;justify-content:space-between;"><b>${c.name}</b><button class="btn btn-outline btn-sm" onclick="viewCampaignLeads('${c.id}')">View</button></div>
          <div style="font-size:11.5px;color:var(--text-faint);">Assigned ${s.assigned} · Uncontacted ${s.uncontacted} · In-Progress ${s.inProgress} · Closed ${s.closed}</div>
        </div>`; }).join("")}
    </div>
  </div>`;
}
function viewCampaignLeads(cid){
  state.view="leads"; state.leadsBucket="all"; state.campaignFilter=cid; render();

}

function openLeadBucket(id){ state.leadsBucket=id; state.campaignFilter=null; render(); }
function backToBuckets(){ state.leadsBucket=null; state.campaignFilter=null; render(); }
function renderLeadList(bucketId){
  const b = BUCKETS.find(x=>x.id===bucketId);
  let list = bucketLeads(bucketId);
  if(state.campaignFilter) list = list.filter(l=>l.campaign===state.campaignFilter);
  return `
  <div class="page-head">
    <button class="back-btn" onclick="backToBuckets()">${icon('arrowLeft',16)}</button>
    <div class="page-title">${b.label}</div>
    ${state.campaignFilter ? `<span class="chip-filter">${CAMPAIGNS.find(c=>c.id===state.campaignFilter).name}<button onclick="state.campaignFilter=null;render();">${icon('x',12)}</button></span>` : ''}

  </div>
  <div class="card">
    ${list.length ? list.map(l=>`
      <div class="lead-row">
        <div class="avatar" style="background:${colorFor(l.name)}">${initials(l.name)}</div>
        <div class="lead-meta">
          <div class="lead-name">${l.name}</div>
          <div class="lead-sub">${l.title} · ${l.company}</div>
        </div>
        <div class="lead-phone">${l.phone}</div>
        <span class="stage-pill ${stagePillClass(l.stage)}">${stageLabel(l.stage)}</span>

        <button class="icon-btn call" title="Call" onclick="clickToCall('${l.id}')">${icon('phoneCall',15)}</button>
      </div>
    `).join("") : `<div class="empty-state">${icon('users',32)}<div class="em-title">No leads here yet</div>Leads that match this bucket will show up here.</div>`}
  </div>`;
}
function startBucketCalling(bucketId){
  const list = bucketLeads(bucketId).filter(l=> !state.campaignFilter || l.campaign===state.campaignFilter);
  if(list.length===0){ showToast("No leads to call in this bucket"); return; }
  state.pd.queue = list.map(l=>l.id);
  state.pd.running = true; state.pd.index=-1; state.pd.dialed=0; state.pd.connected=0;
  state.pd.bucketLabel = BUCKETS.find(b=>b.id===bucketId).label;
  state.view="leads"; state.leadsBucket=bucketId;
  render();
  advancePowerDialer();
}

function closeAddLead(){ state.addLeadOpen=false; render(); }
function renderAddLeadModal(){
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeAddLead()">
    <div class="modal">
      <div class="modal-head"><h3>Add Lead</h3><button class="x" onclick="closeAddLead()">${icon('x',14)}</button></div>
      <input class="field" id="al-name" placeholder="Contact Name">

      <input class="field" id="al-email" placeholder="Email">

        <option value="">Campaign *</option>
        ${CAMPAIGNS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}
      </select>
      <button class="btn btn-primary btn-block" onclick="submitAddLead()">Submit</button>
    </div>
  </div>`;
}
function submitAddLead(){
  const name = document.getElementById("al-name").value.trim();
  const phone = document.getElementById("al-phone").value.trim();
  const email = document.getElementById("al-email").value.trim();
  const campaign = document.getElementById("al-campaign").value;
  if(!phone || !campaign){ showToast("Contact number and campaign are required"); return; }
  walkInLeads.unshift({id:"w"+(walkInLeads.length+1+Math.floor(Math.random()*99)), name:name||"Unnamed Lead", phone, email, campaign, status:"Pending", created:"Just now"});
  state.addLeadOpen=false;
  showToast("Lead added");
  render();
}
function callWalkin(id){
  const w = walkInLeads.find(x=>x.id===id);
  if(!w) return;
  startCall({name:w.name, phone:w.phone, manual:true});
}

function sendWaMessage(){
  const el = document.getElementById("wa-input");
  const val = el.value.trim();
  if(!val) return;
  const thread = WA_THREADS.find(t=>t.id===state.waActiveThread);
  thread.msgs.push({from:"me", text:val});
  thread.last = val;
  render();
}
function waCall(name){
  const lead = leads.find(l=>l.name===name);
  if(lead) clickToCall(lead.id); else startCall({name, phone:"+91 90000 00000", manual:true});
}

/* ---------------- CALL LOGS ---------------- */
function filteredLogs(){
  let list = callLogs;
  const f = state.logFilter;
  if(f==="outgoing") list = list.filter(h=>h.direction==="outgoing");
  else if(f==="incoming") list = list.filter(h=>h.direction==="incoming" && !h.missed);
  else if(f==="missed") list = list.filter(h=>h.missed);
  const q = state.logSearch.trim().toLowerCase();
  if(q) list = list.filter(h=>(h.name+" "+(h.company||"")).toLowerCase().includes(q));
  return list;
}
function dispositionPillClass(d){
  if(d.startsWith("Connected — Interested")) return "pill-connected";
  if(d==="Missed") return "pill-danger";
  if(d==="Connected — Not Interested") return "pill-neutral";
  if(d==="No Answer"||d==="Busy") return "pill-live";
  return "pill-neutral";
}
function renderLogs(){
  const list = filteredLogs();
  const tabs = [{id:"all",label:"All"},{id:"outgoing",label:"Outgoing"},{id:"incoming",label:"Incoming"},{id:"missed",label:"Missed"}];
  return `
  <div class="page-head">
    <span class="chip-filter">Today<button onclick="showToast('Date filter cleared — showing all')">${icon('x',12)}</button></span>
    <div class="tab-row" style="margin-left:auto;">
      ${tabs.map(t=>`<button class="${state.logFilter===t.id?'active':''}" onclick="setLogFilter('${t.id}')">${t.label}</button>`).join("")}
    </div>
  </div>
  <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:10px;">Recording and AI summary/transcript columns are Phase 4 — shown below as illustrative preview data. New calls stay AI-off until Phase 4 preview is turned on in Voice &amp; Devices.</div>
  <div class="card" id="log-list">${renderLogListInner(list)}</div>
  `;
}
function setLogFilter(f){ state.logFilter=f; render(); }
function renderLogListInner(list){
  if(!list.length) return `<div class="empty-state">${icon('phoneLog',32)}<div class="em-title">No Call Logs Found</div>Calls you make or receive will show up here.</div>`;
  return list.map(h=>{
    const open = state.openLogId===h.id;
    return `
    <div class="log-row">
      <div class="log-main" onclick="toggleLogRow('${h.id}')">
        <svg class="caret ${open?'open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.chevron}</svg>
        <div class="avatar" style="background:${h.missed?'var(--danger)':colorFor(h.name)};width:32px;height:32px;flex:0 0 32px;font-size:11.5px;">
          ${h.missed?icon('missed',14):initials(h.name)}
        </div>
        <div class="lead-meta">
          <div class="lead-name">${h.name}${h.company?` <span style="color:var(--text-faint);font-weight:500;">· ${h.company}</span>`:''}</div>
          <div class="lead-sub">${h.direction==='incoming'?'Incoming':'Outgoing'} · ${maskNumber(h.phone)}</div>
        </div>
        <div class="log-col" style="width:100px;">${h.when}</div>
        <div class="log-col mono" style="width:55px;">${fmtDuration(h.duration)}</div>
        <span class="pill ${dispositionPillClass(h.disposition)}" style="width:165px;justify-content:center;">${h.disposition}</span>
        ${h.score!==null?`<span class="score-badge ${scoreClass(h.score)}" style="width:44px;text-align:center;">${h.score}</span>`:`<span style="width:44px;"></span>`}
        <button class="icon-btn" title="${h.recorded?'Play recording':'Not recorded'}" style="opacity:${h.recorded?1:.35};" onclick="event.stopPropagation();${h.recorded?"showToast('Playing recording…')":''}">${icon('play',13)}</button>
        ${h.missed?`<button class="btn btn-sm btn-connect" onclick="event.stopPropagation(); callBackFromLogId('${h.id}')">Call back</button>`:''}
      </div>
      <div class="log-detail ${open?'open':''}">
        <div class="detail-grid">
          <div class="detail-block">
            <div class="field-label">AI Summary</div>

/* ============================================================
   WEB DIALER — Mobile Companion Calling
   CRM never touches audio. It creates a call request, a push goes
   to the agent's registered phone, the phone places a normal
   cellular call, then reports back for disposition.
   ============================================================ */
const WD_STATE_STEPS = [
  {k:"CALL_REQUESTED", l:"Requested"}, {k:"NOTIFICATION_SENT", l:"Push sent"}, {k:"NOTIFICATION_OPENED", l:"Opened"},
  {k:"CALL_INITIATED", l:"Initiated"}, {k:"CALL_RINGING", l:"Ringing"}, {k:"CALL_CONNECTED", l:"Connected"},
  {k:"CALL_COMPLETED", l:"Completed"}, {k:"CALL_DATA_SYNCING", l:"Syncing"}, {k:"CALL_DATA_SYNCED", l:"Synced"},
  {k:"DISPOSITION_PENDING", l:"Disposition"}, {k:"DISPOSITION_SAVED", l:"Saved"},
];
function wdClearTimers(){ state.wd.timers.forEach(t=>clearInterval(t)); state.wd.timers=[]; }
function wdAddTimeline(text){ state.wd.timeline.push({time:nowLabelWD(), text}); }
function nowLabelWD(){ return new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

function renderWebDialer(){
  return `
  <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span>Alternate calling path — the laptop only sends a request, the agent's own phone places the call over its SIM. No modem, no masking.</span>
    <span class="platform-toggle-wd" style="margin-left:auto;display:flex;gap:4px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:20px;padding:3px;">
      <button class="btn btn-sm ${state.wd.platform==='android'?'btn-primary':'btn-ghost'}" style="border-radius:16px;padding:4px 11px;" onclick="wdSetPlatform('android')">Android</button>
      <button class="btn btn-sm ${state.wd.platform==='ios'?'btn-primary':'btn-ghost'}" style="border-radius:16px;padding:4px 11px;" onclick="wdSetPlatform('ios')">iOS fallback</button>
    </span>
  </div>
  <div class="wd-grid">
    <div>
      <div class="card" style="padding:20px;">
        <div style="font-weight:600;font-family:var(--font-display);font-size:14.5px;margin-bottom:2px;">Call request</div>
        <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px;">Agent: ${REP_ME} · Registered device: ${state.wd.platform==='android'?'OnePlus 12 · Android 15':'iPhone 15 · iOS 18'} <span class="pill pill-connected" style="margin-left:4px;">REGISTERED</span></div>

      </div>
    </div>
    <div class="wd-phone-wrap">
      <div class="wd-phone-label">Agent's registered mobile — ${state.wd.platform==='android'?'Android':'iOS (fallback)'}</div>
      ${renderWDPhone()}
    </div>
  </div>`;
}
function renderWDLeadPicker(){
  const list = leads.slice(0,8);

function renderWDActiveRequest(){
  const lead = leads.find(l=>l.id===state.wd.selectedLeadId);
  const terminal = state.wd.callState==="FAILED"||state.wd.callState==="EXPIRED"||state.wd.callState==="CANCELLED";
  const stepIndex = WD_STATE_STEPS.findIndex(s=>s.k===state.wd.callState);
  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
    <div class="avatar" style="background:${colorFor(lead.name)};width:36px;height:36px;font-size:12.5px;">${initials(lead.name)}</div>

    ${(state.wd.callState==="CALL_REQUESTED"||state.wd.callState==="NOTIFICATION_SENT"||state.wd.callState==="NOTIFICATION_OPENED") ? `<button class="btn btn-sm" style="margin-left:auto;" onclick="wdCancelRequest()">Cancel request</button>`:''}
  </div>
  <div class="wd-stepper">
    ${WD_STATE_STEPS.map((s,i)=>`<span class="wd-step ${terminal?'':(i<stepIndex?'done':i===stepIndex?'current':'')} ${terminal && i===stepIndex ? 'failed':''}">${i<stepIndex&&!terminal?icon('check',9):''} ${s.l}</span>`).join("")}
  </div>
  <div class="wd-active">${renderWDStatusBlock()}</div>
  ${state.wd.callState==="DISPOSITION_PENDING" ? renderWDDispositionPanel() : ``}
  ${state.wd.callState==="DISPOSITION_SAVED" ? `
    <div style="margin-top:14px;text-align:center;">
      <span class="pill pill-connected">${icon('check',11)} Disposition saved to lead timeline &amp; Call Logs</span>
      <div style="margin-top:10px;"><button class="btn btn-outline btn-sm" onclick="wdReset()">Start another call</button></div>
    </div>` : ``}
  ${terminal ? `
    <div style="margin-top:12px;text-align:center;">
      <button class="btn btn-primary btn-sm" onclick="wdInitiate('${lead.id}')">Retry call request</button>
      <button class="btn btn-sm" onclick="wdReset()">Back to leads</button>
    </div>` : ``}`;
}
function renderWDStatusBlock(){
  const dev = state.wd.platform==='android'?'OnePlus 12 · Android 15':'iPhone 15 · iOS 18';
  const map = {
    CALL_REQUESTED:{label:"Call request created", sub:"Validating agent, lead and registered device…", spin:true},
    NOTIFICATION_SENT:{label:"Waiting for mobile confirmation", sub:`Push delivered to ${dev}. Expires in ${state.wd.expireCountdown}s if not opened.`, spin:true},
    NOTIFICATION_OPENED:{label:"Agent viewing request on mobile", sub:"Waiting for agent to tap Call Now…", spin:true},
    CALL_INITIATED:{label:"Call initiated on mobile", sub:"Handset is starting the native cellular call…", spin:true},
    CALL_RINGING:{label:"Ringing", sub:"Customer's phone is ringing…", spin:true},
    CALL_CONNECTED:{label:"Call in progress", sub:`Duration ${fmtDuration(state.wd.seconds)} · tracked via mobile OS call events`, spin:false},
    CALL_COMPLETED:{label:"Call completed", sub:"Waiting for available metadata…", spin:true},
    CALL_DATA_SYNCING:{label:"Synchronizing call data", sub:"Backend treats the mobile as an event source, not a single trusted status.", spin:true},
    CALL_DATA_SYNCED:{label:"Call data synced", sub:"Disposition can now be unlocked.", spin:false},
    DISPOSITION_PENDING:{label:"Disposition required", sub:"The lead is not considered disposed until this is completed.", spin:false},
    DISPOSITION_SAVED:{label:"Disposition saved", sub:"Call and outcome written to the lead timeline.", spin:false},
    FAILED:{label:"Call failed", sub:"No valid cellular connection could be established.", spin:false},
    EXPIRED:{label:"Request expired", sub:"Agent did not respond to the push notification in time.", spin:false},

const NOTES_REQUIRED_WD = ["Connected — Interested","Callback Requested","Connected — Not Interested"];
function wdSetPlatform(p){ if(state.wd.callState!=="idle"){ showToast("Finish or cancel the current call request first"); return; } state.wd.platform=p; render(); }
function wdInitiate(leadId){
  wdClearTimers();
  const lead = leads.find(l=>l.id===leadId);
  state.wd = { ...state.wd, selectedLeadId:leadId, callState:"CALL_REQUESTED", callStatus:null, seconds:0,
    timeline:[], disposition:"", notes:"", followUpDate:"", followUpTime:"", timers:[], expireCountdown:0 };
  wdAddTimeline(`Outbound Call Requested — Agent: ${REP_ME} | Customer: ${maskNumber(lead.phone)}`);
  render();
  setTimeout(()=>{
    if(state.wd.callState!=="CALL_REQUESTED") return;
    state.wd.callState="NOTIFICATION_SENT"; state.wd.expireCountdown=20;
    wdAddTimeline("Mobile notification delivered"); render();
    const cd = setInterval(()=>{
      if(state.wd.callState!=="NOTIFICATION_SENT"){ clearInterval(cd); return; }
      state.wd.expireCountdown--;
      if(state.wd.expireCountdown<=0){
        clearInterval(cd); state.wd.callState="EXPIRED";
        wdAddTimeline("Call request expired — no response from mobile"); render(); return;
      }
      const sub=document.querySelector(".wd-status-sub"); if(sub) sub.textContent=`Push delivered to ${state.wd.platform==='android'?'OnePlus 12 · Android 15':'iPhone 15 · iOS 18'}. Expires in ${state.wd.expireCountdown}s if not opened.`;
    },1000);
    state.wd.timers.push(cd);
  }, 900);
}
function wdCancelRequest(){ wdClearTimers(); state.wd.callState="CANCELLED"; wdAddTimeline("Call request cancelled by agent"); render(); }
function wdOpenNotification(){ if(state.wd.callState!=="NOTIFICATION_SENT") return; wdClearTimers(); state.wd.callState="NOTIFICATION_OPENED"; wdAddTimeline("Notification opened on mobile"); render(); }
function wdDecline(){ state.wd.callState="CANCELLED"; wdAddTimeline("Agent declined the call request on mobile"); render(); }
function wdCallNow(){
  state.wd.callState="CALL_INITIATED"; wdAddTimeline("Call initiated on mobile handset"); render();
  setTimeout(()=>{
    if(state.wd.callState!=="CALL_INITIATED") return;
    state.wd.callState="CALL_RINGING"; render();
    const willConnect = Math.random()>0.18;
    setTimeout(()=>{
      if(state.wd.callState!=="CALL_RINGING") return;
      if(willConnect){
        state.wd.callState="CALL_CONNECTED"; state.wd.callStatus="CONNECTED";
        wdAddTimeline("Call connected"); render();
        const t=setInterval(()=>{
          if(state.wd.callState!=="CALL_CONNECTED"){ clearInterval(t); return; }
          state.wd.seconds++; const el=document.getElementById("wd-timer"); if(el) el.textContent=fmtDuration(state.wd.seconds);
        },1000);
        state.wd.timers.push(t);
      } else {
        state.wd.callStatus = Math.random()>0.5 ? "NO_ANSWER" : "BUSY";
        state.wd.callState="CALL_COMPLETED";
        wdAddTimeline(`Call not connected (${state.wd.callStatus.replace("_"," ").toLowerCase()})`);
        render(); wdProceedToSync();
      }
    }, 1800);
  }, 1000);
}
function wdCancelInFlight(){ wdClearTimers(); state.wd.callStatus="FAILED"; state.wd.callState="CALL_COMPLETED"; wdAddTimeline("Call ended before connecting"); render(); wdProceedToSync(); }
function wdEndCall(){ wdClearTimers(); state.wd.callState="CALL_COMPLETED"; wdAddTimeline(`Call completed | Duration: ${fmtDuration(state.wd.seconds)}`); render(); wdProceedToSync(); }
function wdProceedToSync(){
  setTimeout(()=>{
    if(state.wd.callState!=="CALL_COMPLETED") return;
    state.wd.callState="CALL_DATA_SYNCING"; render();
    setTimeout(()=>{
      if(state.wd.callState!=="CALL_DATA_SYNCING") return;
      if(state.wd.platform==="ios" && state.wd.callStatus!=="CONNECTED"){ wdAddTimeline("iOS limits automatic call-state access — outcome flagged for manual confirmation"); }
      state.wd.callState="CALL_DATA_SYNCED"; wdAddTimeline("Call data synchronized"); render();
      setTimeout(()=>{ if(state.wd.callState!=="CALL_DATA_SYNCED") return; state.wd.callState="DISPOSITION_PENDING"; render(); }, 500);
    }, 1400);
  }, 500);
}
function wdSaveDisposition(){
  const wd = state.wd;
  if(!wd.disposition){ showToast("Select a disposition first"); return; }
  if(NOTES_REQUIRED_WD.includes(wd.disposition) && !wd.notes.trim()){ showToast("Notes are required for this disposition"); return; }
  if(wd.disposition==="Callback Requested" && !wd.followUpDate){ showToast("Follow-up date/time is required for Callback"); return; }
  wd.callState="DISPOSITION_SAVED";
  wdAddTimeline(`Disposition: ${wd.disposition}`);
  if(wd.notes.trim()) wdAddTimeline(`Note: ${wd.notes.trim()}`);
  if(wd.disposition==="Callback Requested"){
    const dl = wd.followUpDate ? new Date(wd.followUpDate+"T00:00:00").toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : "TBD";
    wdAddTimeline(`Follow-up: ${dl}, ${wd.followUpTime||'—'}`);
    scheduleFollowUp(leads.find(l=>l.id===wd.selectedLeadId).name, `${dl} · ${wd.followUpTime||'—'}`, wd.notes||wd.disposition, "Call");
  }
  const lead = leads.find(l=>l.id===wd.selectedLeadId);
  pushLog({
    leadId:lead.id, name:lead.name, company:lead.company, phone:lead.phone,
    direction:"outgoing", when:"Just now", duration:wd.seconds, disposition:wd.disposition, score:lead.score,
    missed:false, recorded:false, notes:wd.notes, summary:[], next:null, rep:REP_ME, transcript:[],
  });
  if(wd.disposition.startsWith("Connected — Interested")) lead.stage="in-progress";
  else if(wd.disposition==="Connected — Not Interested") lead.stage="closed";
  else if(wd.disposition==="Callback Requested") lead.stage="follow-up";
  else if(wd.disposition==="No Answer"||wd.disposition==="Busy") lead.stage="not-connected";
  lead.lastContact="Today";
  showToast("Disposition saved — synced to Call Logs & lead timeline");
  render();
}

function startCall(opts){
  if(state.activeCall && state.activeCall.callState!=="ended") return;
  const seq = ++state.callSeq;
  const call = {
    seq, leadId:opts.leadId||null, name:opts.name, company:opts.company||null, phone:opts.phone,
    manual:!!opts.manual, queueMode:!!opts.queueMode,
    callState:"initializing", readySteps:0, seconds:0, muted:false, onHold:false, recording:false,
    notes:"", disposition:"", transcript:[], typing:false, summary:null, score:opts.baseScore??null,
    next:null, followScheduled:false,
  };
  state.activeCall = call;
  state.dialpadOpen=false;
  render();

  // Device/modem/SIM readiness check — call flow §5 steps 4-5.
  let step=0;
  const readyTimer = setInterval(()=>{
    if(state.activeCall?.seq!==seq){ clearInterval(readyTimer); return; }
    step++;
    state.activeCall.readySteps = step;
    render();
    if(step>=READINESS_CHECKS.length){
      clearInterval(readyTimer);
      state.activeCall.callState="dialing";
      render();
    }
  }, 260);

  setTimeout(()=>{ if(state.activeCall?.seq!==seq) return; state.activeCall.callState="ringing"; render(); }, 1100+READINESS_CHECKS.length*260);

  const willAnswer = Math.random() > 0.22;
  setTimeout(()=>{
    if(state.activeCall?.seq!==seq) return;
    if(willAnswer){
      state.activeCall.callState="connected";
      render(); beginDurationTimer(seq); if(state.aiPreviewOn) beginTranscriptStream(seq);
    } else {
      const outcome = Math.random()>0.5 ? "No Answer" : "Voicemail";
      state.activeCall.callState="wrapup"; state.activeCall.disposition=outcome;
      render();
      setTimeout(()=>{ if(state.activeCall?.seq!==seq) return; finalizeCall(outcome, true); }, 700);
    }
  }, 2900+READINESS_CHECKS.length*260);
}
function beginDurationTimer(seq){
  clearInterval(state.timerHandle);
  state.timerHandle=setInterval(()=>{
    if(state.activeCall?.seq!==seq || state.activeCall.callState!=="connected"){ clearInterval(state.timerHandle); return; }
    if(!state.activeCall.onHold) state.activeCall.seconds++;
    const el=document.getElementById("call-timer-live");
    if(el) el.textContent = fmtDuration(state.activeCall.seconds);
  },1000);
}
function beginTranscriptStream(seq){
  let i=0; clearInterval(state.transcriptHandle);
  state.transcriptHandle=setInterval(()=>{
    if(state.activeCall?.seq!==seq || state.activeCall.callState!=="connected"){ clearInterval(state.transcriptHandle); return; }
    if(i>=TRANSCRIPT_POOL.length){ clearInterval(state.transcriptHandle); return; }
    state.activeCall.typing=true; render();
    setTimeout(()=>{
      if(state.activeCall?.seq!==seq) return;
      state.activeCall.typing=false; state.activeCall.transcript.push(TRANSCRIPT_POOL[i]); i++;
      render();
    }, 650);
  }, 2600);
}
function toggleMute(){ if(!state.activeCall) return; state.activeCall.muted=!state.activeCall.muted; render(); }
function toggleHold(){ if(!state.activeCall) return; state.activeCall.onHold=!state.activeCall.onHold; render(); }
function toggleRecording(){
  if(!state.activeCall) return;
  if(!state.aiPreviewOn){ showToast("Recording needs two-way modem audio capture validated first (Phase 4)"); return; }
  state.activeCall.recording=!state.activeCall.recording; render();
}
function setDisposition(val){ if(!state.activeCall) return; state.activeCall.disposition=val; render(); }
function setNotes(val){ if(!state.activeCall) return; state.activeCall.notes=val; }
function endCall(){ if(!state.activeCall) return; clearInterval(state.timerHandle); clearInterval(state.transcriptHandle); state.activeCall.callState="wrapup"; render(); }

function generateAISummary(call, disposition){
  const base = call.score ?? Math.floor(25+Math.random()*70);
  let summary=[], next="", score=base;
  if(disposition==="Connected — Interested"){
    summary=["Prospect confirmed active evaluation and asked clarifying questions on pricing/rollout.","Positive tone throughout — engaged and asked forward-looking questions.","No major objections raised during the call."];
    next="Send follow-up materials within 24 hours and propose a next-step meeting."; score=Math.min(97, base+12);
  } else if(disposition==="Connected — Not Interested"){
    summary=["Prospect indicated no current need or existing vendor commitment.","Tone was polite but firm on declining further contact for now."];
    next="Move to long-term nurture cadence — re-engage in 4–6 months."; score=Math.max(5, base-20);
  } else if(disposition==="Voicemail"){
    summary=["Reached voicemail — left a brief introduction and callback request."];
    next="Send a follow-up SMS or email referencing the voicemail within 2 days.";
  } else if(disposition==="No Answer"){
    summary=["No pickup after multiple rings."];
    next="Retry at a different time of day; consider switching channel to email.";
  } else if(disposition==="Busy"){
    summary=["Line was busy at time of call."]; next="Retry within the next 2 hours.";
  } else if(disposition==="Wrong Number"){
    summary=["Number reached does not belong to the intended contact."]; next="Verify contact record and update phone number before next attempt."; score=Math.max(5, base-15);
  } else if(disposition==="Callback Requested"){
    summary=["Prospect asked to be called back at a more convenient time."]; next="Schedule a follow-up call at the time they requested.";
  } else {
    summary=["Call ended without a recorded outcome."]; next="Review call notes and determine next step manually.";
  }
  return {summary, next, score};
}
function finalizeCall(dispositionOverride, silent){
  const call = state.activeCall;
  if(!call) return;
  const disposition = dispositionOverride || call.disposition || "No Answer";
  const aiOn = state.aiPreviewOn;
  const {summary, next, score} = aiOn ? generateAISummary(call, disposition) : {summary:[], next:null, score:call.score};
  call.disposition=disposition; call.summary=summary; call.next=next; call.score=score; call.callState="ended";

  pushLog({
    leadId:call.leadId, name:call.name, company:call.company, phone:call.phone,
    direction:"outgoing", when:"Just now", duration:call.seconds, disposition, score,
    missed:false, recorded:aiOn && call.recording, notes:call.notes, summary, next, rep:REP_ME,
    transcript: aiOn ? call.transcript.slice() : [],
  });

  if(call.leadId){
    const l = leads.find(x=>x.id===call.leadId);
    if(l){
      if(aiOn) l.score = score;
      if(disposition.startsWith("Connected — Interested")) l.stage="in-progress";
      else if(disposition==="Connected — Not Interested") l.stage="closed";
      else if(disposition==="Callback Requested") l.stage="follow-up";
      else if(disposition==="No Answer"||disposition==="Busy") l.stage="not-connected";
      l.lastContact="Today";
    }
  }

  if(state.pd.running && call.queueMode){
    state.pd.dialed++;
    if(disposition.startsWith("Connected")) state.pd.connected++;
  }
  render();
  if(!silent) showToast("Call logged automatically");
  if(state.pd.running && call.queueMode){ setTimeout(()=>{ advancePowerDialer(); }, 1600); }
}
function finalizeAIRetro(){
  const call = state.activeCall;
  if(!call) return;
  const {summary, next, score} = generateAISummary(call, call.disposition);
  call.summary=summary; call.next=next; call.score=score;
  if(call.leadId){ const l=leads.find(x=>x.id===call.leadId); if(l) l.score=score; }
  const log = callLogs.find(h=>h.leadId===call.leadId && h.name===call.name && h.when==="Just now");
  if(log){ log.summary=summary; log.next=next; log.score=score; }
  showToast("Phase 4 preview generated for this call");
  render();
}
function closeCallDrawer(){ clearInterval(state.timerHandle); clearInterval(state.transcriptHandle); state.activeCall=null; render(); }

function advancePowerDialer(){
  if(!state.pd.running) return;
  const nextIndex = state.pd.index+1;
  if(nextIndex >= state.pd.queue.length){ state.pd.running=false; showToast("Calling session complete"); render(); return; }
  state.pd.index = nextIndex;
  const leadId = state.pd.queue[nextIndex];
  const l = leads.find(x=>x.id===leadId);
  render();
  if(l) startCall({leadId:l.id, name:l.name, company:l.company, phone:l.phone, baseScore:l.score, queueMode:true});
}
function pausePowerSession(){ state.pd.running=false; render(); }
function skipCurrentPD(){
  if(state.activeCall){ clearInterval(state.timerHandle); clearInterval(state.transcriptHandle); state.activeCall=null; }
  advancePowerDialer();
}

function scheduleFollowUp(contactName, when, note, channel){
  tasks.unshift({id:"t"+(taskIdCounter++), note, contact:contactName, when, channel, done:false});
  if(state.activeCall) state.activeCall.followScheduled=true;
  showToast("Follow-up added to My Tasks");
  render();
}
function submitFollowUp(contactName){
  const d=document.getElementById("fu-date").value, t=document.getElementById("fu-time").value;
  const ch=document.getElementById("fu-channel").value, note=document.getElementById("fu-note").value;
  const dateLabel = d ? new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}) : "Date TBD";
  scheduleFollowUp(contactName, `${dateLabel} · ${t||'—'}`, note, ch);
}

function renderCallDrawer(){
  const call = state.activeCall;
  if(!call) return `<div class="call-drawer"></div>`;
  return `<div class="call-drawer open">
    <div class="call-drawer-inner">${renderCallPanel(call)}${state.pd.running && call.queueMode ? renderPDMiniBar() : ''}</div>
  </div>`;
}
function renderPDMiniBar(){
  const pd=state.pd;
  const pct = pd.queue.length ? Math.round(((pd.index+1)/pd.queue.length)*100) : 0;
  return `
  <div class="ai-block" style="margin-top:18px;">
    <div class="ai-block-head">${icon('sparkles',14)}<span>Calling session — ${pd.bucketLabel}</span></div>
    <div style="font-size:12px;color:var(--text-dim);">Lead ${pd.index+1} of ${pd.queue.length} · ${pd.connected} connected</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-sm" style="flex:1;" onclick="pausePowerSession()">${icon('pause',13)} Pause session</button>
      <button class="btn btn-sm" style="flex:1;" onclick="skipCurrentPD()">${icon('skip',13)} Skip</button>
    </div>
  </div>`;
}
function renderCallPanel(call){
  const statusLabel = {initializing:"Checking device…",dialing:"Dialing (VoLTE)…",ringing:"Ringing…",connected:"Active · VoLTE",wrapup:"Call ended",ended:"Call logged"}[call.callState];
  const isLive = call.callState==="initializing"||call.callState==="dialing"||call.callState==="ringing"||call.callState==="connected";
  return `
  <div style="display:flex;justify-content:flex-end;"><button class="icon-btn" onclick="closeCallDrawer()">${icon('x',14)}</button></div>
  <div class="call-head">
    <div class="call-avatar" style="background:${colorFor(call.name)}">${isLive?'<div class="ring"></div>':''}${initials(call.name)}</div>
    <div class="call-name">${call.name}</div>
    <div class="call-company">${call.company||(call.manual?'Manual dial':'Unsaved number')}</div>
    <div class="call-status-row">
      <span class="pill ${call.callState==='connected'?'pill-connected':(call.callState==='ended'||call.callState==='wrapup')?'pill-neutral':'pill-live'}"><span class="pill-dot"></span>${statusLabel}</span>
      ${call.callState==='connected'?`<span class="call-timer" id="call-timer-live">${fmtDuration(call.seconds)}</span>`:''}
    </div>
  </div>

  ${call.callState==="initializing" ? `
  <div class="field-block" style="margin-top:6px;">
    <div class="field-label">Device readiness (POC checks)</div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${READINESS_CHECKS.map((c,i)=>`
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:${i<call.readySteps?'var(--text)':'var(--text-faint)'};">
          ${i<call.readySteps? `<span style="color:var(--connected);">${icon('check',13)}</span>` : `<span class="typing-dot"><span></span><span></span><span></span></span>`}
          ${c.label}
        </div>`).join("")}
    </div>
  </div>` : `
  <div class="masked-row"><span>Business number <span class="mono">${MY_BUSINESS_NUMBER}</span></span><span>${call.manual?'Manual dial':'From '+MY_DEVICE.modem}</span></div>
  `}

  ${(isLive && call.callState!=="initializing") ? `
  <div class="call-controls">
    <button class="ctrl-btn ${call.muted?'active':''}" onclick="toggleMute()" title="Mute">${icon(call.muted?'micOff':'mic',18)}</button>
    <button class="ctrl-btn ${call.onHold?'active':''}" onclick="toggleHold()" title="Hold">${icon('pause',18)}</button>
    <button class="ctrl-btn rec ${call.recording?'active':''}" onclick="toggleRecording()" title="${state.aiPreviewOn?'Toggle recording':'Locked — Phase 4'}">${icon(state.aiPreviewOn?'disc':'lock',18)}${call.recording?'<span class="dot"></span>':''}</button>
    <button class="ctrl-btn end" onclick="endCall()" title="End call">${icon('endCall',18)}</button>
  </div>` : ``}

  ${call.callState==="connected" ? `
  <div class="field-block">
    <div class="field-label">Live transcription ${icon('sparkles',11)}</div>
    ${state.aiPreviewOn ? `
    <div class="live-transcript">
      ${call.transcript.map(t=>`<p><b>${t.who}:</b> ${t.line}</p>`).join("")}
      ${call.typing?`<p class="typing-dot"><span></span><span></span><span></span></p>`:''}
      ${!call.transcript.length && !call.typing ? `<p style="color:var(--text-faint);">Listening…</p>`:''}
    </div>` : `
    <div class="live-transcript" style="color:var(--text-faint);display:flex;align-items:center;gap:7px;">${icon('lock',13)} Arrives in Phase 4, once modem audio capture is validated.</div>`}
  </div>` : ``}

  ${(isLive && call.callState!=="initializing") ? `
  <div class="field-block"><div class="field-label">Call notes</div><textarea class="notes" placeholder="Jot notes while you talk…" oninput="setNotes(this.value)">${call.notes}</textarea></div>` : ``}

  ${call.callState==="wrapup" ? `
  <div class="field-block">
    <div class="field-label">Call disposition</div>
    <select class="disp-select" onchange="setDisposition(this.value)">
      <option value="">Select outcome…</option>
      ${DISPOSITIONS.map(d=>`<option value="${d}" ${call.disposition===d?'selected':''}>${d}</option>`).join("")}
    </select>
  </div>
  <div class="field-block"><div class="field-label">Call notes</div><textarea class="notes" placeholder="Add any final notes…" oninput="setNotes(this.value)">${call.notes}</textarea></div>
  <div class="field-block"><button class="btn btn-primary btn-block" ${call.disposition?'':'disabled'} onclick="finalizeCall()">${icon('note',14)} Save &amp; Log Call</button></div>` : ``}

  ${call.callState==="ended" ? `
  <div class="ai-block">
    <div class="ai-block-head">${icon('note',14)}<span>CRM timeline entry</span></div>
    <div style="font-size:12.5px;line-height:1.7;">
      ${icon('phoneCall',12)} Outbound Call<br>
      Agent: ${REP_ME}<br>
      Duration: ${fmtDuration(call.seconds)}<br>
      Status: ${call.seconds>0?'Connected':'Not connected'}<br>
      Disposition: ${call.disposition}
      ${call.notes?`<br>Notes: ${call.notes}`:''}
    </div>
  </div>
  ${state.aiPreviewOn ? `
  <div class="ai-block"><div class="ai-block-head">${icon('sparkles',14)}<span>AI Call Summary <span class="pill pill-neutral" style="margin-left:4px;">Phase 4 preview</span></span></div><ul class="ai-summary-list">${call.summary.map(s=>`<li>${s}</li>`).join("")}</ul></div>
  <div class="ai-block"><div class="ai-block-head">${icon('target',14)}<span>Lead score &amp; next action</span></div>
    <div class="score-gauge-row">${scoreGaugeSvg(call.score)}<div class="next-action">${icon('target',16)}<p>${call.next}</p></div></div></div>
  ` : `
  <div class="ai-block" style="text-align:center;">
    <div class="ai-block-head" style="justify-content:center;">${icon('lock',14)}<span>AI summary &amp; lead scoring — Phase 4</span></div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">Pending hardware validation of two-way modem audio capture on this device.</div>
    <button class="btn btn-outline btn-sm" onclick="state.aiPreviewOn=true; finalizeAIRetro();">${icon('sparkles',13)} Preview it for this call</button>
  </div>
  `}
  <div class="ai-block"><div class="ai-block-head">${icon('calendar',14)}<span>Schedule follow-up</span></div>
    ${call.followScheduled ? `<div style="font-size:12.5px;color:var(--connected);font-weight:600;">✓ Added to My Tasks</div>` : `
    <div class="followup-row"><input type="date" id="fu-date" style="flex:1;"><input type="time" id="fu-time" value="10:00" style="width:90px;"></div>
    <div class="followup-row"><select id="fu-channel" style="flex:1;"><option>Call</option><option>Email</option><option>Video</option><option>SMS</option></select></div>
    <textarea class="notes" id="fu-note" style="margin-top:8px;min-height:44px;" placeholder="Follow-up note…">${call.next||''}</textarea>
    <button class="btn btn-primary btn-sm btn-block" style="margin-top:8px;" onclick="submitFollowUp('${escapeAttr(call.name)}')">${icon('calendar',13)} Schedule</button>`}
  </div>
  ${!(state.pd.running && call.queueMode) ? `<button class="btn btn-block" style="margin-top:14px;" onclick="closeCallDrawer()">Done</button>` : ``}
  ` : ``}
  `;
}
function scoreGaugeSvg(score){
  const s=score??0, r=24, c=2*Math.PI*r, pct=Math.max(0,Math.min(100,s))/100, col=scoreColor(s);
  return `<div class="score-gauge"><svg viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--surface)" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/>
  </svg><span class="num" style="color:${col}">${s}</span></div>`;
}

/* ---------------- helpers ---------------- */
function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;"); }

/* ---------------- init ---------------- */
restoreSession();
</script>
</body>
</html>

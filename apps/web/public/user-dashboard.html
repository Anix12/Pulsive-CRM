<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Pro — User Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-sunken:#F2F3F8; --border:#E7E8EF; --border-strong:#D8DAE5;
  --text:#14151A; --text-dim:#6B6E7B; --text-faint:#9497A3;
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-soft:#EEEDFD; --on-primary:#FFFFFF;
  --connected:#16A34A; --connected-soft:#DCFCE7;
  --live:#D97706; --live-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --blue-soft:#E0E7FF; --blue:#4F46E5;
  --shadow:0 1px 2px rgba(20,20,30,.04), 0 8px 24px -12px rgba(20,20,30,.12);
  --radius-s:8px; --radius-m:12px; --radius-l:16px;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input{font-family:inherit;}
h1,h2,h3{margin:0;}
#app{min-height:100vh;}

/* ---------------- LOGIN (matches the existing CRM Pro screen) ---------------- */
.login-wrap{display:flex;min-height:100vh;}
.login-left{width:44%;background:#0B0B10;color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between;}
.login-brand{display:flex;align-items:center;gap:10px;}
.login-brand .mark{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.login-brand .name{font-weight:700;font-size:16px;}
.login-quote{max-width:380px;}
.login-quote blockquote{font-size:26px;font-weight:700;line-height:1.35;margin:0 0 18px 0;}
.login-quote .who{font-weight:700;font-size:14px;}
.login-quote .role{color:#9497A3;font-size:12.5px;margin-top:2px;}
.login-foot{display:flex;gap:18px;color:#6B6E7B;font-size:12px;}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
.login-form{width:100%;max-width:400px;}
.login-form h1{font-size:26px;font-weight:800;margin-bottom:4px;}
.login-form .sub{color:var(--text-dim);font-size:14px;margin-bottom:30px;}
.field-label{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between;}
.field-label a{color:var(--primary);font-size:12.5px;font-weight:600;text-decoration:none;}
.field{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-sunken);color:var(--text);font-size:14px;outline:none;margin-bottom:18px;}
.field:focus{border-color:var(--primary);background:var(--surface);}
.btn-signin{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14.5px;cursor:pointer;}
.btn-signin:hover{background:var(--primary-dark);}
.login-error{background:var(--danger-soft);color:var(--danger);padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:16px;}
.login-bottom{text-align:center;font-size:13.5px;color:var(--text-dim);margin-top:22px;}
.login-bottom a{color:var(--primary);font-weight:600;text-decoration:none;}
.demo-creds{background:var(--blue-soft);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#3730A3;margin-top:22px;line-height:1.7;}
.demo-creds b{font-family:var(--font-mono);}

/* ---------------- APP SHELL (shared) ---------------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;}
.sb-brand{display:flex;align-items:center;gap:9px;padding:0 6px 22px 6px;}
.sb-brand .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
.sb-brand .name{font-weight:700;font-size:15.5px;}
.sb-nav{display:flex;flex-direction:column;gap:2px;}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;color:var(--text-dim);font-weight:600;font-size:13.5px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;}
.sb-item svg{width:17px;height:17px;stroke:currentColor;flex:0 0 17px;}
.sb-item:hover{background:var(--surface-sunken);color:var(--text);}
.sb-item.active{background:var(--primary);color:#fff;}
.sb-item.expanded-parent{background:var(--surface-sunken);color:var(--text);}
.sb-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 26px;border-left:1px solid var(--border-strong);padding-left:10px;}
.sb-sub button{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:12px;color:var(--text-dim);border:none;background:transparent;cursor:pointer;width:100%;text-align:left;}
.sb-sub button:hover{background:var(--surface-sunken);color:var(--text);}
.sb-sub button.active{background:var(--primary-soft);color:var(--primary);font-weight:700;}
.sb-sub button svg{width:14px;height:14px;stroke:currentColor;flex:0 0 14px;}
.sb-footer{margin-top:auto;border-top:1px solid var(--border);padding-top:14px;}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 6px;}
.sb-user .av{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 30px;}
.sb-user .meta{flex:1;overflow:hidden;}
.sb-user .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-user .rl{font-size:11px;color:var(--text-faint);}
.sb-user button{border:none;background:transparent;color:var(--text-faint);cursor:pointer;padding:4px;}
.sb-user button:hover{color:var(--danger);}

.main{flex:1;min-width:0;}
.topbar{height:60px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 26px;gap:14px;}
.topbar h2{font-size:17px;font-weight:700;}
.content{padding:26px;max-width:1180px;}

/* ---------------- CARDS / STATS (matches the icon-badge card style) ---------------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);}
.hi{font-size:24px;font-weight:800;}
.hi-sub{color:var(--text-dim);font-size:14px;margin-top:2px;margin-bottom:22px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat-card{padding:18px;position:relative;}
.stat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.stat-icon svg{width:17px;height:17px;}
.stat-num{font-size:24px;font-weight:800;}
.stat-label{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.stat-badge{position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;color:var(--connected);background:var(--connected-soft);padding:2px 8px;border-radius:20px;}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.pill-connected{background:var(--connected-soft);color:var(--connected);}
.pill-live{background:var(--live-soft);color:var(--live);}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill-neutral{background:var(--surface-sunken);color:var(--text-dim);}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;}
.mono{font-family:var(--font-mono);}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer;}
.btn:hover{background:var(--surface-sunken);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-connect{background:var(--connected);border-color:var(--connected);color:#fff;}
.btn-sm{padding:6px 11px;font-size:12px;}
.lead-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);}
.lead-row:last-child{border-bottom:none;}
.lead-meta{flex:1;min-width:0;}
.lead-name{font-weight:600;font-size:13.5px;}
.lead-sub{font-size:11.5px;color:var(--text-faint);}
.score-badge{font-family:var(--font-mono);font-weight:700;font-size:11px;padding:2px 8px;border-radius:20px;}
.icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;}
.icon-btn.call{background:var(--connected);border-color:var(--connected);color:#fff;}
.task-row{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border);}
.task-row:last-child{border-bottom:none;}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);cursor:pointer;flex:0 0 20px;display:flex;align-items:center;justify-content:center;}
.task-check.done{background:var(--connected);border-color:var(--connected);}
.modal-overlay{position:fixed;inset:0;background:rgba(15,15,25,.4);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:380px;box-shadow:var(--shadow);}
.field2{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;margin-bottom:10px;font-size:13px;}
.reports-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chart-wrap{height:200px;margin-top:10px;}
.badge-note{background:var(--live-soft);color:var(--live);font-size:11.5px;font-weight:600;padding:8px 12px;border-radius:8px;margin-bottom:16px;display:inline-flex;gap:7px;align-items:center;}

/* ---------------- AI COACH WORKSPACE ---------------- */
.ac-lead-row{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.ac-callbar{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 16px;margin-bottom:14px;}
.ac-live-badge{display:flex;align-items:center;gap:7px;background:var(--danger-soft);color:var(--danger);font-weight:700;font-size:12px;padding:5px 12px;border-radius:20px;}
.ac-live-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);animation:acpulse 1.2s infinite;}
@keyframes acpulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.ac-timer{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.ac-callbtns{margin-left:auto;display:flex;gap:8px;}
.ac-cbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);}
.ac-cbtn.end{background:var(--danger);border-color:var(--danger);color:#fff;}
.ac-grid{display:grid;grid-template-columns:260px 1fr 280px;gap:14px;align-items:start;}
.ac-lead-card{padding:16px;}
.ac-lead-card .nm{font-weight:700;font-size:15px;margin-top:8px;}
.ac-lead-card .sub{font-size:11.5px;color:var(--text-faint);}
.ac-field-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:12px;}
.lbl{color:var(--text-faint);}
.ac-score-bar{height:6px;background:var(--surface-sunken);border-radius:6px;overflow:hidden;margin-top:5px;}
.ac-score-fill{height:100%;background:var(--connected);border-radius:6px;}
.ac-notes{width:100%;min-height:70px;border:1px solid var(--border-strong);border-radius:8px;padding:9px;font-size:12.5px;margin-top:8px;resize:vertical;}
.ac-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 16px;}
.ac-tabs button{border:none;background:transparent;padding:10px 4px;margin-right:16px;font-weight:600;font-size:12.5px;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;}
.ac-tabs button.active{color:var(--primary);border-color:var(--primary);}
.ac-transcript{padding:14px 16px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.ac-bubble{max-width:75%;padding:9px 13px;border-radius:12px;font-size:12.5px;position:relative;}
.ac-bubble .t{font-size:9.5px;color:var(--text-faint);margin-bottom:3px;}
.ac-bubble.them{background:var(--surface-sunken);align-self:flex-start;border-bottom-left-radius:3px;}
.ac-bubble.me{background:var(--primary-soft);color:var(--text);align-self:flex-end;border-bottom-right-radius:3px;}
.ac-alert{margin:0 16px 12px 16px;background:var(--live-soft,#FEF3C7);color:#B45309;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;}
.ac-suggest{margin:0 16px 14px 16px;background:var(--surface-sunken);border-radius:10px;padding:13px;}
.ac-suggest-head{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:8px;}
.ac-suggest-text{font-size:12.5px;line-height:1.5;margin-bottom:10px;}
.ac-suggest-btns{display:flex;gap:8px;flex-wrap:wrap;}
.ac-input-row{display:flex;gap:8px;padding:0 16px 16px 16px;}
.ac-input-row input{flex:1;border:1px solid var(--border-strong);border-radius:20px;padding:10px 15px;font-size:12.5px;outline:none;}
.ac-send{width:38px;height:38px;border-radius:50%;background:var(--primary);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 38px;}
.ac-insight-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);font-size:12px;}
.ac-insight-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 26px;}
.ac-gauge{width:52px;height:52px;position:relative;}
.ac-gauge svg{width:100%;height:100%;transform:rotate(-90deg);}
.ac-gauge .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.ac-summary-box{background:var(--surface-sunken);border-radius:8px;padding:11px 12px;font-size:11.5px;color:var(--text-dim);line-height:1.6;margin:10px 0;}
.ac-nextstep{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:5px 0;}
.ac-nextstep svg{width:14px;height:14px;stroke:var(--connected);flex:0 0 14px;margin-top:2px;}
.ac-markas{display:flex;gap:7px;margin-top:14px;}
.ac-markas button{flex:1;border:none;border-radius:8px;padding:9px 0;font-weight:700;font-size:11.5px;cursor:pointer;color:#fff;}
.obj2-grid{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start;}
.obj2-item{display:flex;align-items:center;gap:9px;padding:11px 12px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border-left:3px solid transparent;}
.obj2-item.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary);}
.obj2-item:hover:not(.active){background:var(--surface-sunken);}
.conf-badge{margin-left:auto;background:var(--connected-soft);color:var(--connected);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.nba-row{display:flex;align-items:flex-start;gap:14px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;}
.nba-row:last-child{border-bottom:none;}
.nba-row:hover{background:var(--surface-sunken);}
.nba-num{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.nba-title{font-weight:700;font-size:13.5px;}
.nba-desc{font-size:12px;color:var(--text-faint);margin-top:2px;}
.kb-grid{display:grid;grid-template-columns:220px 1fr 280px;gap:16px;align-items:start;}
.kb-side-item{padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;border-radius:8px;}
.kb-side-item.active{background:var(--primary-soft);color:var(--primary);}
.kb-feature{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12.5px;}
.kb-feature svg{width:14px;height:14px;stroke:var(--connected);flex:0 0 14px;}
.kb-ask-bubble{background:var(--surface-sunken);border-radius:10px;padding:11px;font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.6;}
.cs-tags{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px 0;}
.cs-stat{display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid var(--border);border-radius:10px;flex:1;}
.cs-stat svg{width:16px;height:16px;}

@media (max-width:900px){
  .ac-grid{grid-template-columns:1fr;}
  .login-left{display:none;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .reports-grid{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ICONS = {

  pause:`<rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/>`,
  endCall:`<path d="M4 13c4-4 12-4 16 0l-1.3 3.3a1.5 1.5 0 0 1-1.9.7l-2.3-.9a1.5 1.5 0 0 1-.95-1.5l.1-1.4a10 10 0 0 0-4.3 0l.1 1.4a1.5 1.5 0 0 1-.95 1.5l-2.3.9a1.5 1.5 0 0 1-1.9-.7z"/>`,
  grid:`<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>`,
  users:`<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14c2.4.4 4.2 2.3 4.5 5.2" stroke-linecap="round"/>`,

/* ---------------- API HELPERS (real backend calls for AI Sales Coach) ---------------- */
function authHeaders(){ const t=localStorage.getItem('accessToken'); return t?{Authorization:'Bearer '+t}:{}; }
async function apiCall(path, method, body){
  const res = await fetch(path, {
    method: method||'GET',
    headers: { 'Content-Type':'application/json', ...authHeaders() },
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  let json={}; try{ json = await res.json(); }catch{}
  if(!res.ok){
    const msg = json?.error?.message || json?.message || `Request failed (${res.status})`;
    throw new Error(msg);
  }
  return json.data !== undefined ? json.data : json;
}
const apiGet = (path) => apiCall(path, 'GET');
const apiPost = (path, body) => apiCall(path, 'POST', body);

function qrPlaceholderSvg(){
  // deterministic fake QR pattern — visual placeholder only
  let cells="", n=21, size=180, cell=size/n;
  let seed=42;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const onFinder = (x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    const on = onFinder ? ((x%6<5&&y%6<5)?1:0) : (rnd()>0.52?1:0);
    if(on) cells+=`<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px;">${cells}</svg>`;
}

const WD_STEPS=[{k:"CALL_REQUESTED",l:"Requested"},{k:"NOTIFICATION_SENT",l:"Push sent"},{k:"NOTIFICATION_OPENED",l:"Opened"},{k:"CALL_INITIATED",l:"Initiated"},{k:"CALL_RINGING",l:"Ringing"},{k:"CALL_CONNECTED",l:"Connected"},{k:"CALL_COMPLETED",l:"Completed"},{k:"CALL_DATA_SYNCING",l:"Syncing"},{k:"CALL_DATA_SYNCED",l:"Synced"},{k:"DISPOSITION_PENDING",l:"Disposition"},{k:"DISPOSITION_SAVED",l:"Saved"}];
const WD_NOTES_REQUIRED=["Connected — Interested","Connected — Not Interested","Callback Requested"];
function wdClearTimers(){ state.wd.timers.forEach(t=>clearInterval(t)); state.wd.timers=[]; }
function wdNow(){ return new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

function wdActiveRequest(){
  const lead=leads.find(l=>l.id===state.wd.selectedLeadId);
  const terminal=["FAILED","EXPIRED","CANCELLED"].includes(state.wd.callState);
  const idx=WD_STEPS.findIndex(s=>s.k===state.wd.callState);
  const map={
    CALL_REQUESTED:"Call request created…", NOTIFICATION_SENT:`Waiting for mobile confirmation (expires in ${state.wd.expireCountdown}s)`,
    NOTIFICATION_OPENED:"Agent viewing request on mobile…", CALL_INITIATED:"Call initiated on mobile…", CALL_RINGING:"Ringing…",
    CALL_CONNECTED:`Call in progress — ${fmtDuration(state.wd.seconds)}`, CALL_COMPLETED:"Call completed, waiting for metadata…",
    CALL_DATA_SYNCING:"Synchronizing call data…", CALL_DATA_SYNCED:"Call data synced.", DISPOSITION_PENDING:"Disposition required.",
    DISPOSITION_SAVED:"Disposition saved.", FAILED:"Call failed.", EXPIRED:"Request expired — no response.", CANCELLED:"Request cancelled.",
  };
  return `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
    <div class="avatar" style="background:${colorFor(lead.name)};width:34px;height:34px;font-size:12px;">${initials(lead.name)}</div>

    ${WD_STEPS.map((s,i)=>`<span class="pill" style="background:${terminal?'var(--surface-sunken)':i<idx?'var(--connected-soft)':i===idx?'var(--primary-soft)':'var(--surface-sunken)'};color:${terminal?'var(--text-faint)':i<idx?'var(--connected)':i===idx?'var(--primary)':'var(--text-faint)'};">${s.l}</span>`).join("")}

  ${state.wd.callState==="DISPOSITION_SAVED"?`<div style="text-align:center;margin-top:14px;"><span class="pill pill-connected">${icon('check',10)} Saved</span><div style="margin-top:8px;"><button class="btn btn-sm" onclick="wdReset()">Start another call</button></div></div>`:''}

function wdDispositionPanel(){

}
function wdPhone(){

  const cs=state.wd.callState;
  let inner=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(160deg,var(--primary-soft),#fff);"><div style="width:44px;height:44px;border-radius:12px;background:var(--primary);"></div><div style="font-size:10px;color:var(--text-faint);">Standing by</div></div>`;

          <div style="font-size:9.5px;font-weight:700;color:var(--text-faint);">CRM PRO · now</div>

          <div style="font-size:10.5px;color:var(--text-dim);">tap to view</div>
        </div>
      </div>`;
    else if(cs==="NOTIFICATION_OPENED") inner=`
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 16px;">
        <div class="avatar" style="background:${colorFor(lead.name)};width:52px;height:52px;font-size:17px;margin-bottom:10px;">${initials(lead.name)}</div>
        <div style="font-weight:700;font-size:14px;">${lead.name}</div><div style="font-size:11px;color:var(--text-faint);">${lead.company}</div>
        <div style="margin-top:auto;display:flex;gap:8px;width:100%;">
          <button class="btn" style="flex:1;" onclick="wdDecline()">Decline</button>
          <button class="btn btn-connect" style="flex:1;" onclick="wdCallNow()">Call Now</button>
        </div>
      </div>`;
    else if(cs==="CALL_INITIATED"||cs==="CALL_RINGING"||cs==="CALL_CONNECTED") inner=`
      <div style="height:100%;background:#14121c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 14px;text-align:center;">
        <div><div class="avatar" style="background:${colorFor(lead.name)};width:56px;height:56px;font-size:18px;margin-bottom:10px;">${initials(lead.name)}</div>
        <div style="font-weight:700;">${lead.name}</div>
        <div style="font-size:11px;color:#a99fc2;margin-top:6px;">${cs==="CALL_CONNECTED"?"Connected · SIM cellular call":cs==="CALL_RINGING"?"Ringing…":"Calling…"}</div>
        ${cs==="CALL_CONNECTED"?`<div class="mono" style="margin-top:5px;" id="wd-timer">${fmtDuration(state.wd.seconds)}</div>`:''}</div>
        <button style="width:48px;height:48px;border-radius:50%;background:var(--danger);border:none;color:#fff;cursor:pointer;" onclick="${cs==='CALL_CONNECTED'?'wdEndCall()':'wdCancelInFlight()'}">${icon('endCall',18)}</button>
      </div>`;
    else if(cs==="CALL_COMPLETED"||cs==="CALL_DATA_SYNCING") inner=`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;"><div style="width:26px;height:26px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--primary);animation:spin .9s linear infinite;"></div><div style="font-size:12px;font-weight:600;">${cs==="CALL_COMPLETED"?"Call ended":"Syncing…"}</div></div>`;
    else inner=`<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-faint);">Synced ✓</div>`;
  }
  return `<div style="width:220px;height:440px;background:#0d0d14;border-radius:30px;padding:8px;box-shadow:var(--shadow);">
    <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
    <div style="width:100%;height:100%;background:#fff;border-radius:22px;overflow:hidden;">${inner}</div>
  </div>`;
}
function wdInitiate(id){
  wdClearTimers();
  state.wd={...state.wd,selectedLeadId:id,callState:"CALL_REQUESTED",callStatus:null,seconds:0,timeline:[],disposition:"",notes:"",timers:[],expireCountdown:0};
  wdLog("Outbound call requested"); render();
  setTimeout(()=>{ if(state.wd.callState!=="CALL_REQUESTED")return; state.wd.callState="NOTIFICATION_SENT"; state.wd.expireCountdown=15; wdLog("Push notification delivered"); render();
    const cd=setInterval(()=>{ if(state.wd.callState!=="NOTIFICATION_SENT"){clearInterval(cd);return;} state.wd.expireCountdown--; if(state.wd.expireCountdown<=0){clearInterval(cd);state.wd.callState="EXPIRED";wdLog("Request expired");render();return;} render(); },1000);
    state.wd.timers.push(cd);
  },800);
}
function wdOpenNotification(){ state.wd.callState="NOTIFICATION_OPENED"; wdLog("Notification opened on mobile"); render(); }
function wdDecline(){ state.wd.callState="CANCELLED"; wdLog("Agent declined on mobile"); render(); }
function wdCallNow(){
  state.wd.callState="CALL_INITIATED"; wdLog("Call initiated on mobile"); render();
  setTimeout(()=>{ state.wd.callState="CALL_RINGING"; render();
    setTimeout(()=>{
      state.wd.callState="CALL_CONNECTED"; state.wd.callStatus="CONNECTED"; wdLog("Call connected"); render();
      const t=setInterval(()=>{ if(state.wd.callState!=="CALL_CONNECTED"){clearInterval(t);return;} state.wd.seconds++; const el=document.getElementById("wd-timer"); if(el)el.textContent=fmtDuration(state.wd.seconds); },1000);
      state.wd.timers.push(t);
    },1400);
  },900);
}
function wdCancelInFlight(){ wdClearTimers(); state.wd.callState="CALL_COMPLETED"; wdLog("Call ended before connecting"); render(); wdSync(); }
function wdEndCall(){ wdClearTimers(); state.wd.callState="CALL_COMPLETED"; wdLog(`Call completed | Duration: ${fmtDuration(state.wd.seconds)}`); render(); wdSync(); }
function wdSync(){
  setTimeout(()=>{ state.wd.callState="CALL_DATA_SYNCING"; render();
    setTimeout(()=>{ state.wd.callState="CALL_DATA_SYNCED"; wdLog("Call data synchronized"); render();
      setTimeout(()=>{ state.wd.callState="DISPOSITION_PENDING"; render(); },400);
    },1100);
  },400);
}
function wdSaveDisposition(){
  const wd=state.wd;
  if(!wd.disposition) return alert("Select a disposition first");
  if(WD_NOTES_REQUIRED.includes(wd.disposition) && !wd.notes.trim()) return alert("Notes are required for this disposition");
  wd.callState="DISPOSITION_SAVED"; wdLog(`Disposition: ${wd.disposition}`);
  const lead=leads.find(l=>l.id===wd.selectedLeadId);
  callLogs.unshift({name:lead.name,company:lead.company,when:"Just now",duration:wd.seconds,disposition:wd.disposition,score:lead.score});
  if(wd.disposition==="Callback Requested") tasks.unshift({note:"Callback: "+(wd.notes||"follow up"),contact:lead.name,when:"Tomorrow · 10:00 AM",done:false});
  render();
}
function wdReset(){ wdClearTimers(); state.wd={selectedLeadId:null,callState:"idle",callStatus:null,seconds:0,timeline:[],disposition:"",notes:"",timers:[],expireCountdown:0}; render(); }

/* ============================================================
   AI COACH — Telecaller live-call workspace
   Real leads (fetched from /api/v1/ai-sales-coach/my-leads) and real
   Claude-backed guidance (coach-reply / call-summary / kb-ask /
   finish-call). See apps/api/src/modules/ai-sales-coach.
   ============================================================ */
function acDefaultAiState(leadId){
  return { leadId, active:false, seconds:0, timer:null, transcript:[], notes:"", status:"Contacted",
    sentiment:"Neutral", convProb:50, objection:false, suggestedReply:"", alternativeReply:"",
    nextBestAction:"", aiLoading:false, aiError:"", finalSummary:"", ended:false };
}
function acPickLead(id){
  state.ai=acDefaultAiState(id);
  render();
  acStartCall();
}
function acStartCall(){
  state.ai.active=true; render();
  state.ai.timer=setInterval(()=>{ state.ai.seconds++; const el=document.getElementById("ac-timer"); if(el) el.textContent=fmtDuration(state.ai.seconds); },1000);
}
function acSendCustomerMsg(){
  const input=document.getElementById('ac-msg-input');
  if(!input) return;
  const val=input.value.trim();
  if(!val || state.ai.aiLoading) return;
  input.value="";
  state.ai.transcript.push({who:"them", text:val});
  state.ai.suggestedReply=""; state.ai.alternativeReply=""; state.ai.objection=false;
  render();
  acRequestCoach();
}
async function acRequestCoach(){
  state.ai.aiLoading=true; state.ai.aiError=""; render();
  try{
    const r=await apiPost('/api/v1/ai-sales-coach/coach-reply', { leadId: state.ai.leadId, transcript: state.ai.transcript });
    state.ai.objection=!!r.objectionDetected;
    state.ai.sentiment=r.sentiment||"Neutral";
    state.ai.convProb=typeof r.conversionProbability==="number" ? r.conversionProbability : state.ai.convProb;
    state.ai.suggestedReply=r.suggestedReply||"";
    state.ai.alternativeReply=r.alternativeReply||"";
    state.ai.nextBestAction=r.nextBestAction||"";
  }catch(e){
    state.ai.aiError=e.message||"AI Coach is unavailable right now.";
  }finally{
    state.ai.aiLoading=false; render();
  }
}
function acUseResponse(){
  if(!state.ai.suggestedReply) return;
  state.ai.transcript.push({who:"me", text:state.ai.suggestedReply});
  state.ai.objection=false; state.ai.suggestedReply=""; state.ai.alternativeReply="";
  render();
}
function acShowAlternative(){
  if(!state.ai.alternativeReply) return;
  const swap=state.ai.suggestedReply;
  state.ai.suggestedReply=state.ai.alternativeReply;
  state.ai.alternativeReply=swap;
  render();
}
function acNextQuestion(){
  const q=state.ai.nextBestAction || "Could you tell me a bit more about what you're looking for?";
  state.ai.transcript.push({who:"me", text:q});
  state.ai.objection=false; state.ai.suggestedReply=""; state.ai.alternativeReply="";
  render();
}
async function acEndCall(status){
  clearInterval(state.ai.timer);
  state.ai.active=false;
  const lead=leads.find(l=>l.id===state.ai.leadId);
  const dispMap={Converted:"Connected — Interested", Lost:"Connected — Not Interested", "Follow-up":"Callback Requested"};
  const disposition=dispMap[status]||"Connected — Interested";
  state.ai.aiLoading=true; render();
  let summary=`Call with ${lead.name} from ${lead.company}.`;
  let followUpNote = status==="Follow-up" ? `Follow up with ${lead.name} — callback requested.` : "";
  try{
    if(state.ai.transcript.length){
      const s=await apiPost('/api/v1/ai-sales-coach/call-summary', { leadId: state.ai.leadId, transcript: state.ai.transcript });
      summary=s.summary||summary;
      if(status==="Follow-up") followUpNote = s.followUpNote || followUpNote;
    }
  }catch(e){
    state.ai.aiError=e.message||"Could not generate an AI summary — the call was still saved.";
  }
  try{
    const saved=await apiPost('/api/v1/ai-sales-coach/finish-call', {
      leadId: state.ai.leadId, transcript: state.ai.transcript, durationSeconds: state.ai.seconds,
      disposition, summary, conversionProbability: state.ai.convProb,
      ...(followUpNote ? { followUpNote } : {}),
    });
    callLogs.unshift({name:lead.name,company:lead.company,when:"Just now",duration:state.ai.seconds,disposition,score:state.ai.convProb});
    if(saved && saved.task) tasks.unshift({note:saved.task.description||followUpNote, contact:lead.name, when:"In 2 days", done:false});
  }catch(e){
    state.ai.aiError=(state.ai.aiError?state.ai.aiError+" ":"")+(e.message||"Could not save this call.");
    callLogs.unshift({name:lead.name,company:lead.company,when:"Just now",duration:state.ai.seconds,disposition,score:state.ai.convProb});
  }
  state.ai.finalSummary=summary;
  lead.stage = status==="Converted"?"closed":status==="Follow-up"?"follow-up":status==="Lost"?"closed":lead.stage;
  state.ai.aiLoading=false; state.ai.ended=true; render();
}
function acReset(){ state.ai=acDefaultAiState(null); render(); }

/* ---------------- CALL FLOW ---------------- */
function startCall(id){
  const lead=leads.find(l=>l.id===id) || walkInLeads.find(l=>l.id===id);
  state.call={lead,phase:"connecting",seconds:0,disposition:"",notes:""};
  render();
  setTimeout(()=>{
    if(!state.call||state.call.lead.id!==id)return;
    state.call.phase="connected"; render();
    state.call._t=setInterval(()=>{
      if(!state.call)return; state.call.seconds++;
      const el=document.getElementById("call-timer"); if(el)el.textContent=fmtDuration(state.call.seconds);
    },1000);
  },1100);
}
function endCall(){ clearInterval(state.call._t); state.call.phase="wrapup"; render(); }
function closeCall(){ clearInterval(state.call?._t); state.call=null; render(); }
function saveDisposition(){
  const c=state.call;
  if(!c.disposition) return alert("Select a disposition first");
  if(NOTES_REQUIRED.includes(c.disposition) && !c.notes.trim()) return alert("Notes are required for this disposition");
  callLogs.unshift({name:c.lead.name,company:c.lead.company,when:"Just now",duration:c.seconds,disposition:c.disposition,score:c.lead.score});
  if(c.disposition==="Callback Requested") tasks.unshift({note:"Callback: "+(c.notes||"follow up"),contact:c.lead.name,when:"Tomorrow · 10:00 AM",done:false});
  closeCall();
}

        <div class="avatar" style="background:${colorFor(h.name)};width:32px;height:32px;font-size:11px;">${initials(h.name)}</div>
        <div class="lead-meta"><div class="lead-name">${h.name}</div><div class="lead-sub">${h.company} · ${h.when}</div></div>
        <span class="mono" style="font-size:11.5px;color:var(--text-faint);">${fmtDuration(h.duration)}</span>
        <span class="pill ${h.disposition.startsWith('Connected')?'pill-connected':'pill-neutral'}">${h.disposition}</span>
      </div>`).join("")}
  </div>`;
}

/* ---------------- REPORTS ---------------- */
function renderReports(){
  const total=callLogs.length, connected=callLogs.filter(c=>c.disposition.startsWith("Connected")).length;
  return `
  <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
    <div class="card stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Calls</div></div>
    <div class="card stat-card"><div class="stat-num">${connected}</div><div class="stat-label">Connected</div></div>
    <div class="card stat-card"><div class="stat-num">${fmtDuration(Math.round(callLogs.reduce((a,c)=>a+c.duration,0)/Math.max(1,total)))}</div><div class="stat-label">Avg. Duration</div></div>
    <div class="card stat-card"><div class="stat-num">${tasks.filter(t=>!t.done).length}</div><div class="stat-label">Follow-ups Due</div></div>
  </div>
  <div class="reports-grid">
    <div class="card" style="padding:18px;"><div class="section-title">Disposition breakdown</div><div class="chart-wrap"><canvas id="chartDisp"></canvas></div></div>
    <div class="card" style="padding:18px;"><div class="section-title">Calls — last 7 days</div><div class="chart-wrap"><canvas id="chartTrend"></canvas></div></div>
  </div>`;
}
let _charts={};
function renderChartsIfNeeded(){
  if(state.view!=="reports"||state.screen!=="user-dashboard"||typeof Chart==="undefined")return;
  Object.values(_charts).forEach(c=>c&&c.destroy());
  const d=document.getElementById("chartDisp"), t=document.getElementById("chartTrend");
  if(d){ const counts={}; callLogs.forEach(c=>counts[c.disposition]=(counts[c.disposition]||0)+1);
    _charts.d=new Chart(d,{type:'doughnut',data:{labels:Object.keys(counts),datasets:[{data:Object.values(counts),backgroundColor:['#16A34A','#9497A3','#4F46E5','#D97706'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:8,font:{size:10}}}},cutout:"60%",responsive:true,maintainAspectRatio:false}}); }
  if(t){ _charts.t=new Chart(t,{type:'line',data:{labels:["Wed","Thu","Fri","Sat","Sun","Mon","Tue"],datasets:[{label:"Calls",data:[3,5,4,1,1,4,5],borderColor:'#4F46E5',backgroundColor:'#4F46E522',tension:.35,fill:true}]},options:{plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false}}); }
}

/* ---------------- TASKS ---------------- */
function renderTasks(){
  return `<div class="section-title">My tasks</div><div class="card">
    ${tasks.map((t,i)=>`
      <div class="task-row">
        <button class="task-check ${t.done?'done':''}" onclick="tasks[${i}].done=!tasks[${i}].done;render();">${t.done?icon('check',10):''}</button>
        <div class="lead-meta"><div class="lead-name" style="${t.done?'text-decoration:line-through;color:var(--text-faint);':''}">${t.note}</div><div class="lead-sub">${t.contact}</div></div>
        <span class="mono" style="font-size:11px;color:var(--text-faint);">${t.when}</span>
      </div>`).join("")}
  </div>`;
}

/* ---------------- AUTH GUARD ----------------
   This page is a static file, so it can't rely on Next.js middleware —
   the rest of this app guards routes client-side too (see the
   isAuthenticated check in the (dashboard) layout), reading the JWT
   this app's login flow puts in localStorage. This does the same: no
   valid token, or a token that isn't role AGENT (the "user" role),
   sends the visitor to /login instead of rendering the dashboard. */
(async function guardAndBoot(){
  const token = localStorage.getItem('accessToken');
  if (!token) { window.location.href = '/login'; return; }
  try {
    const res = await fetch('/api/v1/auth/me', { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error('unauthorized');
    const body = await res.json();
    const me = body.data || body;
    if (me.role !== 'AGENT') { window.location.href = '/dashboard'; return; }
    // /auth/me only confirms identity + role (id/tenantId/role/email) — it doesn't
    // return firstName/lastName, so the greeting name stays whatever the login
    // redirect passed via ?name=; only backfill email if the query param was empty.
    state.user.email = state.user.email || me.email;
    render();
    // Load this agent's real leads for the AI Coach — falls back to the
    // placeholder leads above if the request fails (e.g. offline).
    try {
      const myLeads = await apiGet('/api/v1/ai-sales-coach/my-leads');
      if (Array.isArray(myLeads)) { leads = myLeads; render(); }
    } catch { /* keep placeholder leads */ }
  } catch {
    window.location.href = '/login';
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulsive — AI Sales Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --surface-sunken:#F3F1FE; --border:#EAEAF3; --border-strong:#DEDCF0;
  --text:#181733; --text-dim:#6B6B85; --text-faint:#9795AC;
  --primary:#6D5DF6; --primary-dark:#5847E8; --primary-soft:#EFECFE; --on-primary:#fff;
  --sidebar-bg:#15132E; --sidebar-text:#A6A3C4; --sidebar-active-bg:#6D5DF6;
  --connected:#16A34A; --connected-soft:#DCFCE7;
  --live:#EA580C; --live-soft:#FFEDD5;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --blue:#2563EB; --blue-soft:#DBEAFE;
  --amber:#D97706; --amber-soft:#FEF3C7;
  --shadow:0 1px 2px rgba(20,20,50,.04), 0 10px 28px -14px rgba(20,20,50,.14);
  --font-display:'Poppins',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input{font-family:inherit;}
h1,h2,h3{margin:0;font-family:var(--font-display);}
#app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{width:224px;flex:0 0 224px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 6px 8px;}
.sb-brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#F2A93C,#E0679E,#6D5DF6);flex:0 0 32px;}
.sb-brand .txt .name{color:#fff;font-weight:700;font-size:15px;}
.sb-brand .txt .tag{font-size:9.5px;color:#7C7A9C;}
.sb-nav{display:flex;flex-direction:column;gap:2px;margin-top:14px;}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;font-weight:500;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--sidebar-text);width:100%;text-align:left;}
.sb-item svg{width:16px;height:16px;stroke:currentColor;flex:0 0 16px;}
.sb-item:hover{background:#1F1D3F;color:#fff;}
.sb-item.active{background:var(--sidebar-active-bg);color:#fff;}
.sb-item .chev{margin-left:auto;width:12px;height:12px;transition:transform .15s;}
.sb-item.expanded .chev{transform:rotate(90deg);}
.sb-sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 30px;border-left:1px solid #2A2850;padding-left:12px;}
.sb-sub button{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;color:var(--sidebar-text);border:none;background:transparent;cursor:pointer;width:100%;text-align:left;}
.sb-sub button:hover{color:#fff;}
.sb-sub button.active{color:#fff;background:#211F45;font-weight:600;}
.sb-sub button svg{width:14px;height:14px;stroke:currentColor;flex:0 0 14px;}
.sb-upgrade{margin-top:auto;background:linear-gradient(155deg,#4C3FD6,#7C5CF0);border-radius:14px;padding:16px;color:#fff;}
.sb-upgrade .ic{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.sb-upgrade .ic svg{width:15px;height:15px;stroke:#fff;}
.sb-upgrade b{font-size:13px;}
.sb-upgrade p{font-size:11px;color:#D8D3FA;margin:5px 0 12px 0;line-height:1.5;}
.sb-upgrade button{width:100%;background:#fff;color:var(--primary-dark);border:none;border-radius:8px;padding:8px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;}
.topbar{height:60px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:10;}
.search-box{display:flex;align-items:center;gap:9px;background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;padding:8px 13px;width:320px;color:var(--text-faint);font-size:13px;}
.search-box svg{width:14px;height:14px;stroke:var(--text-faint);flex:0 0 14px;}
.search-box .kbd{margin-left:auto;font-size:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:5px;padding:1px 6px;color:var(--text-faint);}
.btn-add{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.top-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;color:var(--text-dim);cursor:pointer;}
.top-icon:hover{background:var(--surface-sunken);}
.top-icon svg{width:17px;height:17px;stroke:currentColor;}
.top-icon .badge{position:absolute;top:3px;right:4px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.top-user{display:flex;align-items:center;gap:9px;}
.top-user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F2A93C,#E0679E,#6D5DF6);}
.top-user .nm{font-weight:700;font-size:12.5px;}
.top-user .rl{font-size:10.5px;color:var(--text-faint);}

.content{padding:24px 26px 40px 26px;max-width:1520px;}
.page-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px;}
.page-head h1{font-size:26px;font-weight:800;}
.page-head .sub{color:var(--text-dim);font-size:13px;margin-top:3px;}
.ai-quote{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);}
.ai-quote .bot{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.ai-quote .bot svg{width:15px;height:15px;stroke:var(--primary);}
.ai-quote b{font-size:12.5px;}
.ai-quote span{display:block;font-size:10.5px;color:var(--text-faint);}
.head-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.date-pick{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600;}
.date-pick svg{width:14px;height:14px;stroke:var(--text-dim);}
.btn-live{display:flex;align-items:center;gap:7px;background:var(--connected);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:700;font-size:12.5px;cursor:pointer;}
.dot-pulse{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse2 1.4s infinite;}
@keyframes pulse2{0%,100%{opacity:1;}50%{opacity:.3;}}

.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
.tab-row button{border:none;background:transparent;padding:11px 16px;font-weight:600;font-size:13px;color:var(--text-faint);cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px;}
.tab-row button.active{color:var(--primary);border-color:var(--primary);}
.tab-row button:hover:not(.active){color:var(--text);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);}
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px;}
.kpi-card{padding:16px;display:flex;align-items:center;gap:12px;}
.kpi-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 44px;}
.kpi-ic svg{width:19px;height:19px;}
.kpi-num{font-size:19px;font-weight:800;}
.kpi-label{font-size:10.5px;color:var(--text-faint);margin-top:1px;}
.kpi-delta{font-size:10px;font-weight:700;margin-top:2px;}
.kpi-delta.up{color:var(--connected);}
.kpi-delta.down{color:var(--danger);}

.grid2{display:grid;grid-template-columns:1.65fr 1fr;gap:18px;margin-bottom:18px;align-items:start;}
.section-head{display:flex;align-items:center;gap:9px;padding:16px 18px 0 18px;}
.section-head h3{font-size:15px;font-weight:700;}
.badge-live{display:inline-flex;align-items:center;gap:5px;background:var(--connected-soft);color:var(--connected);font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
.badge-live .d{width:5px;height:5px;border-radius:50%;background:var(--connected);animation:pulse2 1.4s infinite;}
.section-sub{padding:2px 18px 12px 18px;font-size:11.5px;color:var(--text-faint);}
.view-all{margin-left:auto;font-size:12px;color:var(--primary);font-weight:600;text-decoration:none;cursor:pointer;}

table.lc-table{width:100%;border-collapse:collapse;}
table.lc-table th{text-align:left;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;font-weight:700;padding:9px 18px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.lc-table td{padding:11px 18px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle;}
table.lc-table tr:last-child td{border-bottom:none;}
.agent-cell{display:flex;align-items:center;gap:8px;}
.av-sm{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px;flex:0 0 26px;}
.insight-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.sent-cell{display:flex;align-items:center;gap:5px;font-size:12px;}
.status-pill{background:var(--primary-soft);color:var(--primary);font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
.row-actions{display:flex;gap:5px;}
.row-actions .ic-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);}
.row-actions .ic-btn svg{width:12px;height:12px;stroke:currentColor;}

.feed-list{padding:6px 8px 12px 8px;max-height:430px;overflow-y:auto;}
.feed-item{display:flex;gap:10px;padding:10px 10px;border-radius:10px;}
.feed-item:hover{background:var(--surface-sunken);}
.feed-time{font-size:10px;color:var(--text-faint);width:52px;flex:0 0 52px;padding-top:2px;font-family:var(--font-mono);}
.feed-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 28px;}
.feed-ic svg{width:13px;height:13px;}
.feed-body{flex:1;min-width:0;}
.feed-body .t{font-size:12.5px;}
.feed-body .t b{font-weight:700;}
.feed-body .d{font-size:11px;color:var(--text-faint);margin-top:1px;}
.feed-av{width:22px;height:22px;border-radius:50%;flex:0 0 22px;}

.tp-tabs{display:flex;gap:4px;background:var(--surface-sunken);border-radius:10px;padding:3px;margin:0 18px 14px 18px;width:fit-content;}
.tp-tabs button{border:none;background:transparent;padding:6px 14px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--text-dim);cursor:pointer;}
.tp-tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
.mini-bar-track{width:70px;height:6px;background:var(--surface-sunken);border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
.mini-bar-fill{height:100%;background:var(--connected);border-radius:6px;}

.donut-wrap{padding:16px 18px 18px 18px;display:flex;gap:18px;align-items:center;}
.donut-canvas-wrap{position:relative;width:150px;height:150px;flex:0 0 150px;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-center .n{font-size:22px;font-weight:800;}
.donut-center .l{font-size:9.5px;color:var(--text-faint);}
.legend-list{flex:1;display:flex;flex-direction:column;gap:9px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
.legend-row b{margin-left:auto;font-family:var(--font-mono);font-size:12px;}
.legend-row span.pct{color:var(--text-faint);font-size:10.5px;margin-left:4px;}

.obj-list{padding:10px 18px 16px 18px;display:flex;flex-direction:column;gap:11px;}
.obj-row{display:flex;align-items:center;gap:10px;font-size:12px;}
.obj-name{width:112px;flex:0 0 112px;color:var(--text-dim);}
.obj-track{flex:1;height:8px;background:var(--surface-sunken);border-radius:6px;overflow:hidden;}
.obj-fill{height:100%;border-radius:6px;}
.obj-pct{width:34px;flex:0 0 34px;text-align:right;font-weight:700;font-size:11.5px;}

.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.insight-banner{border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:16px;color:#fff;background:linear-gradient(120deg,#2A2158,#4C3FD6);}
.insight-banner .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex:0 0 40px;}
.insight-banner .ic svg{width:19px;height:19px;stroke:#fff;}
.insight-banner .txt{flex:1;}
.insight-banner .lbl{font-size:10.5px;font-weight:700;color:#C9C2FF;text-transform:uppercase;letter-spacing:.04em;}
.insight-banner p{margin:3px 0 0 0;font-size:13px;font-weight:600;line-height:1.4;}
.insight-banner button{background:#fff;color:var(--primary-dark);border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:11.5px;white-space:nowrap;cursor:pointer;}
.promo-banner{border-radius:16px;padding:20px 22px;color:#fff;background:linear-gradient(120deg,#5847E8,#8B6CF0);display:flex;flex-direction:column;justify-content:center;}
.promo-banner b{font-size:15px;}
.promo-banner p{margin:5px 0 0 0;font-size:12px;color:#E4DEFF;line-height:1.5;}

.placeholder-tab{padding:70px 20px;text-align:center;color:var(--text-faint);}

@media (max-width:1300px){ .kpi-row{grid-template-columns:repeat(3,1fr);} .grid2{grid-template-columns:1fr;} .bottom-grid{grid-template-columns:1fr;} }
@media (max-width:800px){ .sidebar{display:none;} .kpi-row{grid-template-columns:1fr 1fr;} .search-box{width:180px;} }
</style>
</head>

let _chart=null;
function renderChart(){
  const el=document.getElementById("outcomeChart");
  if(!el || typeof Chart==="undefined") return;
  if(_chart) _chart.destroy();
  _chart=new Chart(el,{
    type:'doughnut',
    data:{ labels:CALL_OUTCOMES.map(o=>o.label), datasets:[{ data:CALL_OUTCOMES.map(o=>o.count), backgroundColor:CALL_OUTCOMES.map(o=>o.color), borderWidth:0 }]},
    options:{ plugins:{legend:{display:false}}, cutout:"72%", responsive:true, maintainAspectRatio:false }
  });
}

databases:
  - name: crm-postgres
    plan: free
    databaseName: crm_saas
    user: crm_user

services:
  - type: keyvalue
    name: crm-redis
    plan: free
    ipAllowList: []

  - type: web
    name: crm-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crm-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SUPER_ADMIN_JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Fill these in after first deploy once Render assigns your .onrender.com URLs
      - key: API_URL
        sync: false
      - key: WEB_URL
        sync: false

  - type: web
    name: crm-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Fill in after first deploy with the crm-api service's public URL
      - key: NEXT_PUBLIC_API_URL
        sync: false
